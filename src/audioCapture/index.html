<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:<%= webpackConfig.mode === 'development' ? " 'unsafe-eval'" : '' %>; style-src 'self'; img-src 'none'; font-src 'none'; media-src 'self' blob:; connect-src 'self' ws://127.0.0.1:*<%= webpackConfig.mode === 'development' ? ' ws://localhost:*' : '' %>; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'" />
    <!-- SEC-11: see docs/security.md > Content-Security-Policy. blob: in script-src is for the PCM audio worklet, which webpack inlines as a blob: URL; ws://127.0.0.1 is the loopback audio socket (SEC-2). -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Capture</title>
  </head>
  <body></body>
</html>
