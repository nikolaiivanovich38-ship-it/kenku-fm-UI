/* Lyre design round 2: shared components. Views add their own CSS in views/<name>.css and use these classes. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--fs)/1.38 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.display { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.row-flex { display: flex; align-items: center; gap: var(--gap); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 14px; height: 14px; }
svg.i.l { width: 20px; height: 20px; }

/* Focus: always visible, never hidden by a neighbour. */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-s); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ctl); padding: 0 10px; border-radius: var(--r-m);
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); cursor: pointer; font-weight: 700; font-size: var(--fs-s); white-space: nowrap; flex: none; }
.btn:hover { background: var(--surface-3); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.icon { width: var(--ctl); padding: 0; }
.btn.s { height: var(--ctl-s); padding: 0 7px; font-size: var(--fs-xs); border-radius: var(--r-s); }
.btn.s.icon { width: var(--ctl-s); padding: 0; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* Closers and row actions: quiet 24 px squares. */
.closer { display: inline-grid; place-items: center; width: var(--ctl-s); height: var(--ctl-s); border: 0; border-radius: var(--r-s); background: transparent; color: var(--ink-3); cursor: pointer; flex: none; padding: 0; }
.closer:hover { background: var(--surface-3); color: var(--ink); }
.closer svg.i { width: 14px; height: 14px; }

/* Segmented control (radio group of buttons). */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-m); overflow: hidden; flex: none; }
.seg button { height: calc(var(--ctl) - 2px); padding: 0 9px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: var(--fs-s); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"], .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.seg.s button { height: var(--ctl-s); padding: 0 7px; font-size: var(--fs-xs); }

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label, .field > .label { font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; letter-spacing: .02em; }
.input, select.input, textarea.input { height: var(--ctl); padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
textarea.input { height: auto; min-height: 56px; padding: 6px 8px; resize: vertical; }
.input::placeholder { color: var(--ink-3); }
.input[readonly] { background: transparent; border-style: dashed; color: var(--ink-2); }
.search { position: relative; display: flex; align-items: center; min-width: 0; }
.search svg.i { position: absolute; left: 8px; color: var(--ink-3); pointer-events: none; }
.search .input { padding-left: 28px; }
input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; }
input[type="range"] { accent-color: var(--accent); }

/* ---------- Chips and tags ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink-2); font-size: var(--fs-xs); white-space: nowrap; max-width: 100%; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chip.mood .dot { background: var(--mood); } .chip.motif .dot { background: var(--motif); } .chip.scene .dot { background: var(--scenetype); }
.chip.music { color: var(--music); border-color: color-mix(in srgb, var(--music) 40%, transparent); }
.chip.amb { color: var(--amb); border-color: color-mix(in srgb, var(--amb) 40%, transparent); }
.chip.fx { color: var(--fx); border-color: color-mix(in srgb, var(--fx) 40%, transparent); }
.chip.accent { color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
button.chip { cursor: pointer; height: var(--ctl-s); }
button.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .x { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: -4px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; padding: 0; }
.chip .x:hover { background: var(--surface-3); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.kbd { font: 700 var(--fs-xs)/1 var(--num); padding: 2px 5px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--ink-2); background: var(--surface); }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; font-size: var(--fs-xs); font-weight: 700; background: var(--surface-3); color: var(--ink); }
.badge.onair { background: var(--onair); color: var(--onair-ink); }
.badge.accent { background: var(--accent); color: var(--accent-ink); }
.energy { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
.energy span { width: 3px; background: var(--line-strong); border-radius: 1px; }
.energy span:nth-child(1) { height: 4px; } .energy span:nth-child(2) { height: 6px; } .energy span:nth-child(3) { height: 8px; } .energy span:nth-child(4) { height: 10px; } .energy span:nth-child(5) { height: 12px; }
.energy span.on { background: var(--accent-text); }
.lane-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.lane-dot.music { background: var(--music); } .lane-dot.amb { background: var(--amb); } .lane-dot.fx { background: var(--fx); } .lane-dot.preview { background: var(--preview); }

/* ---------- Panes: every pane collapses to its header and can expand to fill its column. ---------- */
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }
.pane > header { display: flex; align-items: center; gap: 6px; min-height: var(--pane-head); padding: 2px 6px 2px 2px; border-bottom: 1px solid var(--line); flex: none; }
.pane.collapsed > header { border-bottom: 0; }
.pane-h { margin: 0; font: inherit; display: flex; min-width: 0; flex: none; max-width: 60%; }
.pane-toggle { display: flex; align-items: center; gap: 6px; height: var(--ctl-s); padding: 0 6px 0 4px; border: 0; background: transparent; color: var(--ink); cursor: pointer; border-radius: var(--r-s); min-width: 0; flex: none; max-width: 100%; }
.pane-toggle:hover { background: var(--surface-2); }
.pane-toggle .chev { transition: transform .15s; color: var(--ink-3); }
.pane.collapsed .pane-toggle .chev { transform: rotate(-90deg); }
.pane-title { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: calc(var(--fs-l) * var(--display-scale)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane-summary { flex: 1; min-width: 0; font-size: var(--fs-s); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-actions { display: flex; align-items: center; gap: 4px; flex: none; }
.pane-body { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
.pane-body.flush { padding: 0; }
.pane.collapsed > .pane-body { display: none; }
.pane.collapsed { flex: none !important; }
/* A column of panes: expanded panes share the height; collapsed ones keep only their header. */
.col { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; min-width: 0; }
.col > .pane { flex: 1 1 0; }
.col > .pane[data-size="auto"] { flex: 0 1 auto; }
.col.has-max > .pane:not(.maxed) { display: none; }
.col.has-max > .pane.maxed { flex: 1 1 auto; }

/* ---------- Lists, rows and tables ---------- */
.list { list-style: none; display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 8px; min-height: var(--row); padding: 2px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--surface-2); }
.lrow[aria-selected="true"], .lrow.selected { background: var(--surface-3); box-shadow: inset 3px 0 0 var(--accent); }
.lrow .title { font-weight: 700; }
.lrow .sub { font-size: var(--fs-xs); color: var(--ink-2); }
.lrow .acts { display: flex; gap: 2px; flex: none; opacity: .0; }
.lrow:hover .acts, .lrow:focus-within .acts, .lrow.selected .acts { opacity: 1; }
@media (hover: none) { .lrow .acts { opacity: 1; } }
table.grid { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
table.grid th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: left; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; padding: 5px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
table.grid td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; height: var(--row); }
table.grid tr:hover td { background: var(--surface-2); }
table.grid tr[aria-selected="true"] td { background: var(--surface-3); }
table.grid tr[aria-selected="true"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); width: 0; }
.progress.music > span { background: var(--music); } .progress.amb > span { background: var(--amb); } .progress.fx > span { background: var(--fx); } .progress.preview > span { background: var(--preview); }

/* ---------- Menus and sheets (inline, never covering the live controls) ---------- */
.menu { position: absolute; z-index: 30; min-width: 200px; max-width: 320px; max-height: 60vh; overflow: auto; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: var(--shadow); padding: 4px; }
.menu [role="menuitem"], .menu [role="menuitemradio"], .menu [role="menuitemcheckbox"], .menu [role="option"], .menu .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--ctl); padding: 0 8px; border: 0; background: transparent; color: var(--ink); text-align: left; border-radius: var(--r-s); cursor: pointer; font-size: var(--fs-s); }
.menu [role="menuitem"]:hover, .menu [role="menuitemcheckbox"]:hover, .menu [role="menuitemradio"]:hover, .menu [role="option"]:hover, .menu .item:hover, .menu [aria-selected="true"] { background: var(--surface-3); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.menu .group { font-size: var(--fs-xs); color: var(--ink-3); padding: 6px 8px 2px; font-weight: 700; }
.sheet { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgb(0 0 0 / .5); padding: 16px; }
.sheet > .panel { width: min(640px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-l); box-shadow: var(--shadow); }
.sheet > .panel > header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); }
.sheet > .panel > header h2 { font-family: var(--display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: calc(var(--fs-h) * var(--display-scale)); flex: 1; }
.sheet > .panel > .body { padding: 12px 14px; overflow: auto; flex: 1; min-height: 0; }
.sheet > .panel > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); }
.empty { padding: 16px; text-align: center; color: var(--ink-2); font-size: var(--fs-s); }
.hint { font-size: var(--fs-xs); color: var(--ink-3); }
.status-line { font-size: var(--fs-xs); color: var(--ink-2); }

/* ---------- App shell ---------- */
#frame { height: 100%; display: flex; flex-direction: column; }
#stagewrap { flex: 1; min-height: 0; display: flex; justify-content: center; background: color-mix(in srgb, var(--bg) 70%, #000); }
#app { flex: 1; min-height: 0; display: grid; grid-template-columns: auto 1fr; background: var(--bg); width: 100%; container-type: inline-size; container-name: app; }
#stagewrap.half #app { max-width: var(--frame-w); box-shadow: 0 0 0 1px var(--line-strong), 0 0 40px rgb(0 0 0 / .5); }
.rail { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; background: color-mix(in srgb, var(--bg) 60%, var(--surface)); border-right: 1px solid var(--line); width: 156px; overflow: hidden; }
.rail.min { width: 44px; }
.rail .logo { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; margin-bottom: 4px; }
.rail .logo svg { width: 28px; height: 28px; flex: none; }
.rail .logo b { font-family: "Lora", Georgia, serif; font-size: 19px; font-weight: 600; color: var(--ink); }
.rail.min .logo b, .rail.min .lbl { display: none; }
.rail a, .rail button.nav { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--r-m); color: var(--ink-2); text-decoration: none; border: 0; background: transparent; cursor: pointer; font-weight: 700; font-size: var(--fs-s); white-space: nowrap; }
.rail a:hover, .rail button.nav:hover { background: var(--surface-2); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.rail .live-link { margin-top: 6px; color: var(--ink); border: 1px solid var(--line-strong); }
.rail .bottom { margin-top: auto; }
.view { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.viewhead { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.viewhead h1 { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: calc(20px * var(--display-scale)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 4px; font-size: var(--fs-s); color: var(--ink-2); min-width: 0; flex-wrap: wrap; }
.crumbs a { color: var(--ink-2); text-decoration: none; border-radius: var(--r-s); padding: 3px 3px; display: inline-block; min-height: 24px; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs .sep { color: var(--ink-3); }
.viewbody { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
.viewbody.fill { overflow: hidden; display: flex; flex-direction: column; }
.statusbar { display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 10px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--ink-2); flex: none; min-width: 0; }

/* Prototype strip: not part of Lyre. */
.proto { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 5px 10px; background: #efe8d6; color: #1d1a14; font: 12.5px/1.3 "Atkinson Hyperlegible", system-ui, sans-serif; border-bottom: 2px solid #c8bd9f; color-scheme: light; flex: none; }
.proto b { font-family: "Lora", Georgia, serif; font-size: 14px; }
.proto label { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.proto select, .proto button { height: 26px; border: 1px solid #8a7f63; border-radius: 4px; background: #fffaf0; color: #1d1a14; padding: 0 6px; font: inherit; cursor: pointer; }
.proto button[aria-pressed="true"] { background: #1d1a14; color: #fffaf0; }
.proto :focus-visible { outline: 2px solid #1f4e8c; outline-offset: 1px; }
.notes { flex: none; background: #f7f1e3; color: #1d1a14; border-bottom: 2px solid #c8bd9f; padding: 6px 12px 8px; font: 12.5px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif; color-scheme: light; max-height: 30vh; overflow: auto; }
.notes h2 { font: 600 14px "Lora", Georgia, serif; margin-bottom: 2px; }
.notes ul { padding-left: 18px; columns: 2 320px; column-gap: 24px; }
.notes li { margin: 1px 0; break-inside: avoid; }
.toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: var(--r-m); font-size: var(--fs-s); font-weight: 700; box-shadow: var(--shadow); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Picker sheet */
.pk-list { display: flex; flex-direction: column; max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-m); }
.pk-group { position: sticky; top: 0; background: var(--surface-2); font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); padding: 4px 8px; border-bottom: 1px solid var(--line); }
.pk-item { display: flex; align-items: center; gap: 8px; min-height: var(--row); padding: 3px 8px; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; white-space: pre; }
.pk-item:hover { background: var(--surface-2); }
/* Headings focused after a page change (for screen readers) need no outline. */
.viewhead h1[tabindex="-1"]:focus { outline: none; }

.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.pk-item.indent { padding-left: 32px; }
.pk-groupbtn { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: var(--fs-s); padding: 0 8px; min-height: var(--ctl); cursor: pointer; border-bottom: 1px solid var(--line); position: sticky; top: 0; text-align: left; }
.pk-groupbtn[aria-expanded="false"] svg { transform: rotate(-90deg); }
/* Pane headings are h2 elements around the toggle; views that widened the toggle widen its heading too. */
.cp-side > .pane:not(.collapsed) > header .pane-h { max-width: none; flex: 1; }
.lb-strip .pane-h { max-width: none; max-height: 55%; }
/* Round 3: clearer separation between panes (Nik: "more definition between the sections"). */
.pane { border-color: var(--line-strong); }
.pane > header { background: var(--surface-2); border-bottom-color: var(--line-strong); }
.col { gap: 10px; }
.mode-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
/* Expanders inside pickers and lists */
.xp-btn { display: inline-grid; place-items: center; width: var(--ctl-s); height: var(--ctl-s); border: 0; border-radius: var(--r-s); background: transparent; color: var(--ink-2); cursor: pointer; flex: none; padding: 0; }
.xp-btn:hover { background: var(--surface-3); color: var(--ink); }
.xp-btn[aria-expanded="false"] svg { transform: rotate(-90deg); }
.xp-body { padding: 4px 8px 6px 40px; border-bottom: 1px solid var(--line); background: var(--bg); }
.xp-row { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: var(--fs-s); min-width: 0; }
.xp-row .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.s.pv[aria-pressed="true"], .closer.pv[aria-pressed="true"] { color: var(--preview); border-color: var(--preview); }
.pk-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding-right: 6px; }
.pk-row > .pk-item { flex: 1; border-bottom: 0; }
.pk-row > .pk-item.indent { padding-left: 32px; }

/* On-air bar outside Live */
.onairbar { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 10px; border-top: 2px solid var(--onair); background: var(--surface-2); flex: none; min-width: 0; }
.onairbar .oab-items { display: flex; gap: 12px; flex: 1; min-width: 0; overflow: hidden; font-size: var(--fs-s); }
.onairbar .oab-item { display: flex; align-items: center; gap: 5px; min-width: 0; max-width: 45%; }
.onairbar a.btn { text-decoration: none; }
/* w3-ux 10: what a large change did, with Undo (and Ctrl+Z), like the board's resize message; above the on-air bar. */
.undo-note { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 8px; margin: 4px 8px; border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); border-radius: var(--r-m); background: var(--surface-2); font-size: var(--fs-s); flex: none; min-width: 0; }
.undo-note > svg { color: var(--accent-text); flex: none; }
.undo-note .grow { min-width: 0; }
.pk-preview { display: flex; align-items: center; gap: 6px; font-size: var(--fs-s); color: var(--ink); min-width: 0; }

/* Round 4 clean-up: every box shows what it is for (a coloured top edge by kind, an icon and a plain title)
   and what it is doing now (one status pill). Colour means: red = the players hear it; accent = your next action
   or your selection; lane dots = music / ambience / effects. Everything else is neutral. */
.pane { border-top-width: 3px; }
.pane.k-onair { border-top-color: var(--onair); }
.pane.k-music { border-top-color: var(--music); }
.pane.k-scenes { border-top-color: var(--ink-2); }
.pane.k-search { border-top-color: var(--line-strong); }
.pane.k-fx { border-top-color: var(--fx); }
.pane-status { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; border: 1px solid var(--line-strong); color: var(--ink-2); background: transparent; white-space: nowrap; }
.pane-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.pane-status.s-live { color: var(--onair-ink); background: var(--onair); border-color: var(--onair); }
.pane-status.s-live::before { background: var(--onair-ink); }
.pane-status.s-on { color: var(--ink); border-color: var(--accent); }
.pane-status.s-on::before { background: var(--accent); }
.pane-status.s-warn { color: var(--warn); border-color: var(--warn); }
.pane-status.s-warn::before { background: var(--warn); }
/* Tags are neutral everywhere: the dot keeps the group, the text stays ink. */
.chip.mood, .chip.motif, .chip.scene { color: var(--ink-2); border-color: var(--line); }

/* A room box that is silent loses its red edge: red means the players hear something. */
.pane.k-onair.is-silent { border-top-color: var(--line-strong); }

/* Outputs view (prefix op-) */
.op-body { padding: 10px 12px; }
/* Narrow and half screen: the On air boxes on top (two across when they fit), all voice channels below.
   Wide: the On air boxes in a column on the left, the channels on the right. */
.op-split { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.op-roomcol { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; gap: 10px; flex: none; max-height: 62%; overflow: auto; }
.op-roomcol > .pane { flex: none; }
.op-chcol { flex: 1; min-height: 0; }
@container app (min-width: 1180px) {
  .op-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .op-roomcol { grid-template-columns: minmax(0, 1fr); max-height: none; min-height: 0; align-content: start; }
}

/* One On air box per bot: title = the room, bot name small beside it */
.op-box-room > header .pane-summary { flex: 1; }
.op-botname { font-size: var(--fs-xs); color: var(--ink-2); }
.op-f { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 5px 8px; min-width: 0; }
.op-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.op-roomrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.btn.op-room { flex: 1 1 auto; min-width: 0; justify-content: space-between; font-weight: 400; font-size: var(--fs-s); }
.btn.op-room .op-rv { flex: 1; min-width: 0; text-align: left; }
.btn.op-room.primary .muted { color: inherit; }
.op-recv { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl-s); padding: 0 8px 0 4px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: transparent; color: var(--ink-2); cursor: pointer; font-size: var(--fs-s); max-width: 100%; white-space: nowrap; }
.op-recv:hover { background: var(--surface-3); color: var(--ink); }
.op-recv[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); font-weight: 700; }
.op-recv[aria-disabled="true"] { cursor: default; }
.op-box { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1px solid var(--line-strong); border-radius: 3px; flex: none; }
.op-recv[aria-pressed="true"] .op-box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.op-box svg.i { width: 12px; height: 12px; stroke-width: 2.6; }
.op-play { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: var(--fs-s); }
.op-pl { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 20px; }
.op-pp { flex: 0 0 22%; }
.op-who { font-size: var(--fs-s); min-width: 0; }
.op-volrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.op-meter { flex: 0 0 28%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.op-meter > span { display: block; height: 100%; width: 0; background: var(--ink-2); border-radius: 3px; transition: width .14s linear; }
.op-volrow input[type="range"] { flex: 1; min-width: 0; height: 24px; margin: 0; }
.op-volrow output { width: 36px; text-align: right; font-size: var(--fs-s); }
.op-warn { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: var(--fs-xs); color: var(--warn); font-weight: 700; min-width: 0; }
.op-warn svg { flex: none; }
.op-warn.op-err { color: var(--danger); }

/* Menus: channel name, people, and a warning line when needed */
.op-menu { display: flex; flex-direction: column; }
.menu .op-mi { align-items: flex-start; padding-top: 4px; padding-bottom: 4px; }
.menu .op-mi > svg, .menu .op-mi > .op-box { margin-top: 2px; }
.op-mi-t { display: flex; flex-direction: column; min-width: 0; }
.op-mi-n { font-weight: 700; }
.op-mi.here .op-mi-n { color: var(--accent-text); }
.op-mi-s { font-size: var(--fs-xs); color: var(--ink-2); }
.op-mi-w { display: flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--warn); font-weight: 700; }
.menu .op-mi.op-mi1 { align-items: center; padding-top: 0; padding-bottom: 0; }
.menu .op-mi.op-mi1 > svg, .menu .op-mi.op-mi1 > .op-box { margin-top: 0; }
.op-mi1 .op-mi-s, .op-mi1 .op-mi-w { flex: none; white-space: nowrap; }
.menu .group.op-mg { color: var(--ink); font-size: var(--fs-s); }
.op-mg-bot { font-weight: 400; color: var(--ink-2); font-size: var(--fs-xs); }
.menu .group.op-mg2 { padding: 2px 8px 0 30px; font-weight: 400; }

/* All voice channels: one line per channel */
.op-srv + .op-srv { margin-top: 10px; }
.op-srv-h { display: flex; align-items: center; gap: 6px; font-size: var(--fs-s); font-weight: 700; padding: 0 2px 4px; min-width: 0; }
.op-chs { border: 1px solid var(--line); border-radius: var(--r-m); }
.op-ch { display: grid; grid-template-columns: 16px minmax(60px, max-content) minmax(0, 1fr) auto 76px; align-items: center; gap: 8px; min-height: var(--row); padding: 2px 8px; border-bottom: 1px solid var(--line); min-width: 0; font-size: var(--fs-s); }
.op-ch:last-child { border-bottom: 0; }
.op-ch.live { box-shadow: inset 3px 0 0 var(--onair); }
.op-ch-n { min-width: 0; max-width: 160px; }
.op-ch-who { color: var(--ink-2); }
.op-botchip { color: var(--ink); }
.op-twice { color: var(--warn); border-color: var(--warn); font-weight: 700; }
.op-bring { justify-self: end; }
.op-ch > .chip { justify-self: end; }
.op-nobody { display: inline-flex; align-items: center; gap: 4px; color: var(--warn); font-weight: 700; }
.op-foot { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; }
.op-foot svg { margin-top: 1px; }
/* Round 4 follow-up: quiet "via <bot>" line; a labelled level meter after the volume */
.op-via { font-size: var(--fs-xs); color: var(--ink-2); margin: -2px 0 6px; }
.op-lvl { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.op-lvl-l { font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; }
.op-lvl .op-meter { flex: none; width: 56px; }

/* Playlists views (#/playlists, #/playlist/<id>). Prefix pl-. */

/* ---------- All playlists ---------- */
.pl-listbody { display: flex; flex-direction: column; gap: var(--gap); }
.pl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; flex: none; }
.pl-search { flex: 1 1 200px; max-width: 340px; }
.pl-listcol { flex: 1; min-height: 0; }
/* A list laid out as a grid (not a table), so a row's expander can open full width. One line per row. */
.pl-grid { display: grid; grid-template-columns: minmax(0, 1fr) 48px 56px 84px; align-items: center; column-gap: 10px; padding: 0 8px; }
.pl-colhead { position: sticky; top: 0; z-index: 1; background: var(--surface); font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; height: 24px; border-bottom: 1px solid var(--line-strong); }
.pl-c { text-align: right; }
.pl-list { list-style: none; margin: 0; padding: 0; }
.pl-item { border-bottom: 1px solid var(--line); }
.pl-row { min-height: var(--row); padding-top: 2px; padding-bottom: 2px; cursor: pointer; }
.pl-row:hover { background: var(--surface-2); }
.pl-row > * { min-width: 0; }
.pl-namecell { display: flex; align-items: center; gap: 6px; min-width: 0; margin-left: -4px; }
.pl-kicon { display: inline-grid; color: var(--ink-3); flex: none; }
.pl-kicon svg.i { width: 13px; height: 13px; }
.pl-nm { font-weight: 700; color: var(--ink); text-decoration: none; border-radius: var(--r-s); flex: 0 1 auto; }
.pl-nm:hover { text-decoration: underline; }
.pl-namecell .badge { flex: none; }
.pl-xp { padding-left: 36px; max-height: 260px; overflow: auto; border-bottom: 0; border-top: 1px solid var(--line); }
.pl-xpmeta { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-xs); color: var(--ink-2); margin: 2px 0 4px; }
.pl-xpmeta > span { display: flex; align-items: center; gap: 6px; }
.pl-xpmeta svg.i { width: 12px; height: 12px; color: var(--ink-3); flex: none; }
.menu [data-act="plcreate"] { padding: 4px 8px; }
.pl-racts { display: flex; gap: 2px; justify-content: flex-end; align-items: center; }
.pl-more-btn { color: var(--ink-2); }
.pl-mk { margin-left: auto; }
/* Kind and lane as quiet text, used in the playlist head and Details. */
.pl-kl { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; }
.pl-kl svg.i { width: 13px; height: 13px; color: var(--ink-3); }
.pl-kl .sep { color: var(--ink-3); margin: 0 2px; }

/* ---------- One playlist: layout ---------- */
.pl-head { flex-wrap: nowrap; }
.pl-head .crumbs { flex: none; }
.pl-h1 { flex: 0 1 auto; max-width: 42%; min-width: 60px; padding-right: 2px; }
.pl-headchips { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1000 auto; flex-wrap: wrap; height: 20px; overflow: hidden; }
.pl-pvbtn svg.i { color: var(--preview); }
.pl-pvbtn[aria-pressed="true"] { border-color: var(--preview); background: color-mix(in srgb, var(--preview) 16%, var(--surface-2)); }
/* Narrow (single column): panes take their natural height and the page scrolls. */
.pl-body { display: flex; flex-direction: column; }
.pl-page { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.pl-page, .pl-page > .col { flex: none; }
.pl-page > .col > .pane { flex: none; }
/* Wide (from 900 px): track list and a side column of about a third; columns fill the height. */
@container app (min-width: 900px) {
  .pl-body { overflow: hidden; }
  .pl-page { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 34%; align-items: stretch; }
  .pl-page > .col { min-height: 0; }
  .pl-page > .col > .pane { flex: 1 1 0; }
  .pl-page > .col > .pane[data-size="auto"] { flex: 0 1 auto; }
  .pl-page > .col.has-max > .pane.maxed { flex: 1 1 auto; }
}

/* ---------- Track rows ---------- */
.pl-tracks { list-style: none; margin: 0; padding: 0; }
.pl-tr { display: flex; align-items: center; gap: 8px; min-height: var(--row); padding: 3px 6px 3px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
.pl-tr:last-child { border-bottom: 0; }
.pl-tr:hover { background: var(--surface-2); }
.pl-tr.pl-is-pv { box-shadow: inset 3px 0 0 var(--preview); }
.pl-grip { display: inline-grid; place-items: center; width: 14px; color: var(--ink-3); cursor: grab; flex: none; }
.pl-grip svg.i { width: 14px; height: 14px; }
.pl-pos { width: 18px; text-align: right; color: var(--ink-2); flex: none; }
/* Nik picks tracks by their long descriptive titles: up to two lines; the title in the file, tags and energy are in the tooltip. */
.pl-tline { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.pl-tname { font-weight: 700; color: var(--ink); text-decoration: none; border-radius: var(--r-s); min-width: 0; flex: 0 1 auto; line-height: 1.3;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.pl-tname:hover { text-decoration: underline; }
.pl-dur { width: 36px; text-align: right; flex: none; }
.pl-tacts { display: flex; align-items: center; gap: 2px; flex: none; }
.pl-tline .chip { flex: none; height: 18px; }
.pl-tacts .closer:disabled { opacity: .3; cursor: default; }
.pl-tacts .closer:disabled:hover { background: transparent; color: var(--ink-3); }
.pl-added { color: var(--ink-2); }
.pl-added svg.i { color: var(--ok); }
.pl-dragging { opacity: .45; }
.pl-drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.pl-drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.pl-foot { padding: 6px 8px; border-top: 1px solid var(--line); }

/* ---------- Add tracks ---------- */
.pl-addbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; background: var(--surface); }
.pl-count { font-size: var(--fs-xs); flex: none; }

/* ---------- Rule builder ---------- */
.pl-conds { display: flex; flex-direction: column; gap: 6px; }
.pl-cond { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 5px 6px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-2); min-width: 0; }
.pl-and { width: 40px; font-size: var(--fs-s); flex: none; }
select.input.pl-sel { width: auto; height: var(--ctl-s); padding: 0 4px; font-size: var(--fs-s); border-radius: var(--r-s); flex: none; }
select.input.pl-num { width: 44px; }
.pl-vals { flex: 1 1 200px; align-items: center; }
.pl-vals .chip { height: var(--ctl-s); }
.pl-vals .btn.s { height: var(--ctl-s); }
.pl-warn { color: var(--warn); }
.pl-rulebar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.pl-energy { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); white-space: nowrap; }
.pl-check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); cursor: pointer; min-height: var(--ctl-s); }
.pl-enhint { margin-top: 4px; }
.pl-words { margin-top: 8px; font-size: var(--fs-s); }
.pl-mq { padding: 2px 2px 4px; }
.pl-mq .input { height: var(--ctl-s); }
.menu [data-act="plvalpick"] .chip { pointer-events: none; }

/* ---------- Used in and Details ---------- */
.pl-use { gap: 8px; padding-top: 3px; padding-bottom: 3px; }
.pl-upos { flex: none; font-size: var(--fs-xs); }
.pl-ulink { color: var(--ink); font-weight: 700; text-decoration: none; display: block; border-radius: var(--r-s); }
.pl-ulink:hover { text-decoration: underline; }
.pl-lv { flex: none; width: 62px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.pl-levels { padding: 6px 8px; border-top: 1px solid var(--line); }
.pl-details { gap: 10px; }
.pl-facts { min-width: 0; }
.pl-danger { padding-top: 6px; border-top: 1px solid var(--line); }
.pl-dellist { padding-left: 18px; margin-top: 6px; font-size: var(--fs-s); }
@container app (min-width: 900px) { .pl-main > .pane:not(.collapsed) { min-height: 180px; } }
.pl-more { padding: 6px 8px; border-top: 1px solid var(--line); }
.pl-addbar .search { flex: 1 1 200px; }
/* Marker: this track has its own audio profile in this playlist. */
.pl-own { display: inline-grid; place-items: center; width: 14px; height: 17px; flex: none; }
.pl-own-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); }
/* Rule chips: the 16 px remove button gets a 24 px clickable area without making the chip taller. */
.pl-vals .chip .x { width: 24px; height: 24px; margin: -1px -7px -1px -3px; }
.pl-tline .badge, .pl-tline .chip { flex: none; white-space: nowrap; }

/* ---------- Dropping files from the computer ---------- */
#view[data-view="playlist"], #view[data-view="playlists"] { position: relative; }
.pl-dropzone { display: none; position: absolute; inset: 4px; z-index: 6; pointer-events: none; border: 2px dashed var(--accent); border-radius: var(--r-l);
  background: color-mix(in srgb, var(--accent) 7%, transparent); }
#view.pl-filedrag .pl-dropzone { display: block; }
.pl-dropmsg { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px);
  padding: 6px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: var(--fs-s); box-shadow: var(--shadow); text-align: center; }
.pl-droptarget > .pl-row { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.pl-notice { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; flex: none; margin-bottom: var(--gap); padding: 5px 6px 5px 10px; border: 1px solid var(--line-strong);
  border-radius: var(--r-m); background: var(--surface-2); font-size: var(--fs-s); }
.pl-notice > svg.i { color: var(--ink-2); }
.pl-notice > .grow { min-width: 200px; }
.pl-notice a.btn { text-decoration: none; }
.pl-asktext { flex: none; }
select.input.pl-asksel { width: auto; max-width: 220px; height: var(--ctl-s); padding: 0 4px; font-size: var(--fs-s); }
.pl-drophint { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
@keyframes pl-flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 3px 0 0 var(--accent); } 100% { background: transparent; box-shadow: inset 3px 0 0 transparent; } }
.pl-tr.pl-flash, .pl-item.pl-flash > .pl-row { animation: pl-flash 3s ease-out; }
@media (prefers-reduced-motion: reduce) { .pl-tr.pl-flash, .pl-item.pl-flash > .pl-row { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); } }

/* Audio profile view (#/profile/<trackId>[/<place>]). Prefix ap-. */

/* ---------- header ---------- */
.ap-head { align-items: flex-start; gap: 6px 12px; padding-top: 6px; padding-bottom: 8px; }
.ap-id { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ap-head .crumbs { flex-wrap: nowrap; }
.ap-cr-t { max-width: 36ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap-head h1 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; }
.ap-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: var(--fs-s); color: var(--ink-2); min-width: 0; }
.ap-meta > span { min-width: 0; overflow-wrap: anywhere; }
.ap-headacts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; flex: 0 1 auto; padding-top: 2px; }
.ap-saved { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--ink-2); }
.ap-saved svg { color: var(--ok); }

/* "Settings for": which place is being edited */
.ap-place { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface-2); min-width: 0; }
.ap-place.is-own { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.ap-place.is-ro { border-style: dashed; }
.ap-place-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.ap-place-sel { flex: 1 1 340px; max-width: 470px; width: auto; min-width: 180px; }
.ap-place-st { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; flex: 1 1 260px; min-width: 0; }
.ap-place-h { flex: 1 1 220px; min-width: 0; color: var(--ink-2); }
.ap-badge { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-s); font-weight: 700; color: var(--ink); min-width: 0; }
.ap-badge svg { color: var(--ink-3); }
.ap-choice { flex: 0 1 auto; flex-wrap: wrap; max-width: 100%; }
.ap-choice button { white-space: normal; text-align: left; }
.ap-place.is-ro .ap-place-st { flex-basis: 100%; }

/* ---------- layout ---------- */
.ap-body { padding: 10px 12px 16px; }
.ap-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: start; }
.ap-grid > .pane { min-width: 0; }
@container app (min-width: 900px) {
  .ap-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ap-wavepane, .ap-mpane { grid-column: 1 / -1; }
}
.ap-wavepane .pane-h, .ap-endpane .pane-h, .ap-fadepane .pane-h, .ap-mpane .pane-h { max-width: 70%; }

/* ---------- waveform ---------- */
.ap-wave { position: relative; height: 202px; margin: 2px 8px 0; user-select: none; touch-action: none; }
.ap-canvas { position: absolute; left: 0; top: 52px; width: 100%; height: 112px; display: block; }
.ap-scrub { position: absolute; left: 0; right: 0; top: 0; height: 186px; z-index: 2; cursor: pointer; border-radius: var(--r-s); }
.ap-scrub:focus-visible { outline-offset: 1px; }
.ap-out { position: absolute; top: 0; height: 186px; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--bg) 55%, transparent) 0 5px, color-mix(in srgb, var(--bg) 25%, transparent) 5px 10px); border-radius: var(--r-s); }
.ap-out span { position: absolute; top: 96px; left: 50%; transform: translate(-50%, -50%); font-size: var(--fs-xs); color: var(--ink-2); background: var(--surface); padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.ap-loop { position: absolute; top: 24px; height: 140px; z-index: 1; pointer-events: none; background: color-mix(in srgb, var(--ink) 6%, transparent); border-top: 2px dashed var(--ink-3); }
.ap-ph { position: absolute; top: 44px; height: 122px; width: 2px; margin-left: -1px; background: var(--ink-2); z-index: 3; pointer-events: none; }
.ap-ph::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: inherit; border-top: 7px solid var(--ink-2); border-bottom: 0; }
.ap-ph.on { background: var(--preview); }
.ap-ph.on::before { border-top-color: var(--preview); }

/* Start, End and Loop handles: a tab to grab and a line through the waveform, both draggable. */
.ap-h { position: absolute; top: 0; height: 164px; width: 14px; margin-left: -7px; z-index: 4; cursor: ew-resize; touch-action: none; }
.ap-h::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.ap-h:hover::before { width: 3px; left: 5.5px; }
.ap-htab { position: absolute; top: 0; left: 6px; display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 7px 0 3px; border-radius: 0 var(--r-s) var(--r-s) 0;
  background: var(--ink); color: var(--bg); font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; }
.ap-htab svg { opacity: .75; }
.ap-h-end .ap-htab { left: auto; right: 6px; border-radius: var(--r-s) 0 0 var(--r-s); padding: 0 3px 0 7px; flex-direction: row-reverse; }
.ap-h-loop { top: 24px; height: 140px; }
.ap-h-loop::before { background: repeating-linear-gradient(to bottom, var(--ink-2) 0 5px, transparent 5px 8px); }
.ap-h-loop .ap-htab { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.ap-h:focus-visible { outline: none; }
.ap-h:focus-visible .ap-htab, .ap-fk:focus-visible .ap-knob { outline: 2px solid var(--focus); outline-offset: 2px; }
.ap-wave.ro .ap-h, .ap-wave.ro .ap-fk { cursor: not-allowed; }
.ap-wave.ro .ap-htab { opacity: .75; }
/* Fade length handles: round knobs on the volume line. */
.ap-fk { top: 50px; height: 24px; width: 24px; margin-left: -12px; z-index: 5; }
.ap-fk::before { display: none; }
.ap-knob { position: absolute; left: 5px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--ink-2); }
.ap-fk:hover .ap-knob { transform: scale(1.15); }

.ap-flag { position: absolute; top: 166px; height: 20px; display: flex; align-items: center; gap: 3px; z-index: 3; cursor: pointer; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
.ap-flag::before { content: ""; width: 2px; height: 16px; background: var(--ink-3); flex: none; margin-left: -1px; }
/* Crowded markers show their label only on hover (the Markers box lists them all). */
.ap-flag.crowd .ap-flag-l { display: none; }
.ap-flag.crowd:hover { z-index: 6; }
.ap-flag.crowd:hover .ap-flag-l { display: inline; background: var(--surface); padding: 0 3px; border-radius: 3px; }
.ap-flag-l { overflow: hidden; text-overflow: ellipsis; }
.ap-flag:hover { color: var(--ink); }
.ap-flag.flip { flex-direction: row-reverse; transform: translateX(-100%); }
.ap-flag.flip::before { margin-left: 0; margin-right: -1px; }
.ap-ruler { position: absolute; left: 0; right: 0; top: 186px; height: 16px; border-top: 1px solid var(--line); }
.ap-tick { position: absolute; top: 1px; transform: translateX(-50%); font: 600 var(--fs-xs)/14px var(--num); color: var(--ink-3); white-space: nowrap; }
.ap-tick.first { transform: none; }
.ap-tick.last { transform: translateX(-100%); }

/* ---------- listening ---------- */
.ap-listen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.ap-transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ap-pvbtn { border-color: var(--preview); background: color-mix(in srgb, var(--preview) 13%, var(--surface-2)); }
.ap-pvbtn svg { color: var(--preview); }
.ap-pvbtn:hover { background: color-mix(in srgb, var(--preview) 22%, var(--surface-2)); }
.ap-pvbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--preview) 26%, var(--surface-2)); border-color: var(--preview); }
.ap-readouts { display: flex; align-items: flex-end; gap: 6px 18px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
.ap-ro { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.ap-ro-l { font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; white-space: nowrap; }
.ap-pos { font-size: 30px; line-height: 1; color: var(--ink); min-width: 4.6ch; }
.ap-toend { font-size: 20px; line-height: 1.2; color: var(--ink); }
.ap-loops { font-size: 16px; line-height: 1.4; color: var(--ink); }
.ap-meter { min-width: 128px; }
.ap-meter-s { font-weight: 400; color: var(--preview); }
.ap-meter-row { display: flex; align-items: center; gap: 6px; height: 24px; }
.ap-meter-track { width: 96px; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; border: 1px solid var(--line-strong); }
.ap-meter-bar { display: block; height: 100%; width: 0; background: linear-gradient(to right, var(--preview), color-mix(in srgb, var(--preview) 60%, var(--ink))); transition: width .08s linear; }
.ap-meter-v { font-size: 15px; color: var(--ink); min-width: 4ch; }
.ap-air { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.ap-event { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 8px; border-radius: var(--r-m); border-left: 3px solid var(--preview);
  background: color-mix(in srgb, var(--preview) 11%, var(--surface)); font-size: var(--fs-s); min-width: 0; }
.ap-event > svg { color: var(--preview); }
.ap-ho-p { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.ap-ho-time { font-size: var(--fs-s); min-width: 5ch; text-align: right; }
.ap-keys { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.ap-keys .hint { flex: 1 1 300px; line-height: 1.8; }
.ap-switch { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); cursor: pointer; min-height: 24px; }

/* ---------- at the end ---------- */
.ap-opts { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ap-opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 1px 8px; align-items: center; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--r-m); cursor: pointer; }
.ap-opt input { grid-row: 1 / span 2; }
.ap-opt:hover { background: var(--surface-2); }
.ap-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.ap-opt-t { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); }
.ap-opt-s { font-size: var(--fs-xs); color: var(--ink-2); grid-column: 2; }
.ap-opts[disabled] .ap-opt { cursor: default; opacity: .8; }
.ap-next { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; padding: 6px 8px; border-radius: var(--r-m); background: var(--surface-2); min-width: 0; }
.ap-next select { width: 100%; }
.ap-fields { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.ap-frow { display: grid; grid-template-columns: 84px 66px minmax(0, auto); justify-content: start; gap: 4px 8px; align-items: center; }
.ap-frow > label { font-size: var(--fs-s); font-weight: 700; color: var(--ink-2); }
.ap-time { text-align: center; font-size: 15px; }
.ap-time[aria-invalid="true"] { border-color: var(--danger); }
.ap-err { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--danger); }

/* ---------- fades ---------- */
.ap-fadeblock { display: flex; flex-direction: column; gap: 5px; padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.ap-fadeblock:last-child { border-bottom: 0; padding-bottom: 0; }
.ap-fadeblock:first-child { padding-top: 0; }
.ap-fb-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ap-fb-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.ap-fb-l { width: 62px; flex: none; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.ap-step { display: inline-flex; align-items: center; gap: 4px; }
.ap-secs { width: 52px; height: var(--ctl-s); }
.ap-int { display: inline-flex; align-items: center; gap: 6px; flex: 1 1 150px; min-width: 0; }
.ap-int input[type="range"] { flex: 1 1 80px; min-width: 70px; height: 24px; margin: 0; }
.ap-sketch { width: 64px; height: 28px; flex: none; }
.ap-sk { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ap-sk-base { stroke: var(--line-strong); stroke-width: 1; }
.ap-shname { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); min-width: 44px; }
.ap-fb-row .ap-err { flex-basis: 100%; }

/* ---------- markers ---------- */
.ap-mpane .pane-body { padding: 0; }
.ap-mpane .empty { text-align: left; }
.ap-mrow { gap: 8px; }
.ap-mt { width: 38px; flex: none; text-align: right; }
.ap-ml { flex: 1 1 auto; height: var(--ctl-s); }
.ap-mrow .ap-ml:disabled { border-style: dashed; background: transparent; }

/* ---------- link-button for other views ---------- */
.ap-link { text-decoration: none; position: relative; }
.ap-link-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); flex: none; }

@container app (max-width: 760px) {
  .ap-headacts { justify-content: flex-start; flex: 1 1 100%; }
  .ap-air { margin-left: 0; }
  .ap-pos { font-size: 26px; }
}

/* Look and feel view */
.lk-intro { max-width: 860px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.lk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.lk-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); }
.lk-card > header { display: flex; flex-direction: column; gap: 1px; }
.lk-card > header h2 { font-size: calc(17px * var(--display-scale)); }
.lk-card > p { font-size: var(--fs-s); }
.lk-card > .btn { align-self: flex-start; }
.lk-sample { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r-m); background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: var(--fs)/1.38 var(--body); }
.lk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lk-head .pane-title { font-size: calc(17px * var(--display-scale)); white-space: normal; overflow: visible; }
.lk-head { flex-wrap: wrap; }
.lk-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.lk-row .progress { margin-top: 4px; }
.lk-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.lk-sw { display: flex; height: 14px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.lk-sw i { flex: 1; }
.lk-h2 { font-size: calc(17px * var(--display-scale)); margin: 18px 0 8px; }
.lk-fixed { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.lk-fixed > div { display: flex; align-items: center; gap: 6px; font-size: var(--fs-s); }

/* Campaigns, Campaign and Session views (prefix cp-). */

/* ---------- Campaigns: card grid, 1 column at 720, 2 at 960, 3 at 1280 ---------- */
.cp-count { font-size: var(--fs-s); }
.cp-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: stretch; }
@container app (min-width: 900px) { .cp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container app (min-width: 1200px) { .cp-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* Each card carries its campaign's data-theme, so it re-declares the base colours and type. */
.cp-card { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 12px 10px; overflow: hidden;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-l); font: var(--fs)/1.38 var(--body); }
.cp-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--second)); }
.cp-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; font-size: var(--fs-xs); }
.cp-sys { font-weight: 700; color: var(--ink-2); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cp-thname { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); white-space: nowrap; flex: none; }
.cp-card-name { font-size: calc(19px * var(--display-scale)); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-blurb { color: var(--ink-2); font-size: var(--fs-s); }
.cp-next { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: var(--fs-s); }
.cp-next-lbl { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); flex: none; }
.cp-next-name { font-weight: 700; color: var(--ink); min-width: 0; }
.cp-next-date { color: var(--ink-2); font-size: var(--fs-xs); flex: none; white-space: nowrap; }

.cp-card-btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: auto; padding-top: 2px; flex-wrap: wrap; }
.cp-btnlink { text-decoration: none; }

/* New campaign sheet */
.cp-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.cp-wide { grid-column: 1 / -1; }
.cp-err { color: var(--danger); font-size: var(--fs-xs); font-weight: 700; }
.cp-err[hidden] { display: none; }
.cp-form .input[aria-invalid="true"] { border-color: var(--danger); }
.cp-themes { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cp-themes legend { padding: 0; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; letter-spacing: .02em; }
.cp-th-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-top: 2px; }
.cp-th { display: flex; flex-direction: column; gap: 4px; padding: 6px; min-width: 0; cursor: pointer; background: var(--bg); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-m); font: var(--fs-s)/1.3 var(--body); }
.cp-th:hover { border-color: var(--ink-3); }
.cp-th:has(input:checked) { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.cp-th:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
.cp-th-prev { display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); }
.cp-th-h { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: calc(18px * var(--display-scale)); line-height: 1; color: var(--ink); }
.cp-th-row { display: flex; gap: 3px; }
.cp-th-row i { height: 4px; border-radius: 2px; }
.cp-th-row i.m { flex: 3; background: var(--music); } .cp-th-row i.a { flex: 2; background: var(--amb); }
.cp-th-btn { width: 44px; height: 10px; border-radius: 3px; background: var(--accent); }
.cp-th-name { display: flex; align-items: center; gap: 5px; font-weight: 700; min-width: 0; }
.cp-th-name input { flex: none; }
.cp-th-sub { font-size: var(--fs-xs); color: var(--ink-2); padding-left: 21px; }
.sheet > .panel[data-theme] { color: var(--ink); font: var(--fs)/1.38 var(--body); }

/* ---------- Campaign and Session pages: shared layout ---------- */
.cp-body { gap: var(--gap); }
.cp-details { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 10px; flex: none; min-width: 0; }
.cp-details .field { flex: 1 1 160px; }
.cp-details .cp-f-name { flex: 2 1 200px; }
.cp-details .cp-f-blurb { flex: 3 1 240px; }
.cp-details .cp-f-theme { flex: 0 1 170px; }
.cp-details .cp-f-date { flex: 0 1 150px; }
.cp-details .cp-f-status { flex: 0 1 110px; }
.cp-forced { flex: 1 1 100%; }
.cp-order { flex: 1 1 100%; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--ink-3); }
.cp-order svg { flex: none; }
.cp-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 34%); gap: var(--gap); }
.cp-split.cp-ssplit { grid-template-columns: minmax(0, 1fr) minmax(260px, 34%); }
.cp-split > .col { min-height: 0; }
/* Side column: an open pane shows its whole title (its summary is for the folded state). */
.cp-side > .pane:not(.collapsed) > header .pane-h, .cp-side > .pane:not(.collapsed) > header .pane-toggle { max-width: none; flex: 1; }
.cp-side > .pane:not(.collapsed) > header .pane-summary { display: none; }
.cp-btnsub { font-weight: 400; opacity: .85; }
.cp-none { padding: 10px; color: var(--ink-2); font-size: var(--fs-s); }
.cp-why { padding: 0 0 6px; }
.cp-make { padding-top: 6px; }
.cp-addrow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding-top: 6px; }
.cp-make a, .cp-why a, .cp-addrow a { color: var(--accent-text); }
/* Single column at narrow widths (720 px): the page scrolls and panes take their natural height. */
@container app (max-width: 899px) {
  .viewbody.fill.cp-body { overflow: auto; }
  .cp-split, .cp-split.cp-ssplit { display: flex; flex-direction: column; flex: none; }
  .cp-split > .col > .pane { flex: none; }
  .cp-split .pane-body { overflow: visible; }
}

/* Status badges: words always shown, colour only adds to them. */
.cp-status { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 3px; font-size: var(--fs-xs); font-weight: 700; flex: none; white-space: nowrap; }
.cp-status.next { background: var(--accent); color: var(--accent-ink); }
.cp-status.played { color: var(--ink-2); background: var(--surface-3); }
.cp-status.draft { color: var(--ink-2); border: 1px dashed var(--line-strong); }
.viewhead .cp-status { margin-left: 2px; }

/* Assigned playlists and pad boards: one line each; details in the tooltip and the expander */
.cp-alist { border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.cp-arow-wrap { border-bottom: 1px solid var(--line); }
.cp-arow-wrap:last-child { border-bottom: 0; }
.cp-arow { display: flex; align-items: center; gap: 4px; min-height: var(--row); padding: 2px 4px 2px 2px; min-width: 0; }
.cp-arow:hover { background: var(--surface-2); }
.cp-aname { color: var(--ink); text-decoration: none; font-weight: 700; font-size: var(--fs-s); border-radius: var(--r-s); margin-left: 2px; }
.cp-aname:hover { text-decoration: underline; }

/* Sessions list */
.cp-slist .lrow { display: grid; grid-template-columns: 14px 22px minmax(0, 1fr) 96px 64px 52px 24px; gap: 6px; padding: 2px 4px 2px 4px; }
.cp-sn { text-align: right; color: var(--ink-3); font-size: 15px; }
.cp-sname { color: var(--ink); text-decoration: none; font-weight: 700; border-radius: var(--r-s); }
.cp-sname:hover { text-decoration: underline; }
.cp-sdate { font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp-slist .cp-status { justify-self: start; }

.cp-slist .btn.s { width: 52px; }
.cp-slist .lrow:not(:hover):not(:focus-within) .btn.s:not(.primary) { color: var(--ink-2); }
@container app (max-width: 760px) { .cp-slist .lrow { grid-template-columns: 14px 22px minmax(0, 1fr) 92px 64px 52px 24px; } }

/* Drag and drop */
.cp-handle { display: grid; place-items: center; width: 14px; height: 24px; color: var(--ink-3); cursor: grab; flex: none; }
.cp-handle:hover { color: var(--ink); }
[data-drag].cp-dragging { opacity: .45; }
[data-drag].cp-drop-before { box-shadow: 0 -2px 0 var(--accent); }
[data-drag].cp-drop-after { box-shadow: 0 2px 0 var(--accent); }

/* ---------- Session planner: scene cards ---------- */
.cp-scenes { list-style: none; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cp-scene { min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-m); }
.cp-scene.open { background: var(--surface); border-color: var(--line-strong); box-shadow: inset 3px 0 0 var(--accent); }
.cp-scene-head { display: flex; align-items: center; gap: 4px; min-height: 32px; padding: 2px 4px 2px 2px; min-width: 0; }
.cp-scene-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 2px; border: 0; background: transparent; color: var(--ink); cursor: pointer; border-radius: var(--r-s); text-align: left; font-weight: 700; }
.cp-scene-toggle:hover { background: var(--surface-3); }
.cp-scene-toggle .chev { color: var(--ink-3); transform: rotate(-90deg); transition: transform .15s; }
.cp-scene-toggle[aria-expanded="true"] .chev { transform: none; }
.cp-scn { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; flex: none; }
.cp-scene.open .cp-scn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cp-scname { font-size: var(--fs); }
.cp-scchip { display: flex; align-items: center; gap: 2px; min-width: 0; max-width: 46%; flex: 0 1 auto; }
/* On a wide window a scene's music stays beside its name: the name takes at most 28em, the ⋯ menu stays at the end. */
.cp-scene-toggle { max-width: 28em; }
.cp-scchip { margin-right: auto; }
.cp-chip { height: 24px; text-decoration: none; max-width: 100%; min-width: 0; gap: 5px; background: var(--surface); color: var(--ink-2); }
.cp-chip:hover { text-decoration: underline; background: var(--surface-3); }

.cp-more { display: inline-grid; place-items: center; height: 24px; padding: 0 4px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); flex: none; white-space: nowrap; }
.cp-empty-chip { display: inline-flex; align-items: center; height: 24px; padding: 0 7px; border: 1px dashed var(--line-strong); border-radius: 999px; font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }

/* Open scene: the form */
.cp-scene-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; padding: 4px 10px 10px 40px; min-width: 0; }
.cp-span { grid-column: 1 / -1; }
.cp-scene-body textarea.input { min-height: 44px; }
.menu .cp-danger { color: var(--danger); }
@container app (max-width: 760px) {
  .cp-scene-body { grid-template-columns: minmax(0, 1fr); padding-left: 10px; }
}

/* Expander gap keeps rows aligned when an item has nothing to expand (a single track). */
.cp-xpgap { width: var(--ctl-s); flex: none; }
.cp-xp { padding-left: 32px; }
.cp-alist .xp-body { border-bottom: 0; border-top: 1px solid var(--line); }

/* Open scene: ordered lists of music items and pad boards, and the ambience slot */
.cp-box { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); }

.cp-boxbtns { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 5px 6px; }
.cp-mnone { font-size: var(--fs-xs); padding: 6px 8px; }
.cp-items { list-style: none; display: flex; flex-direction: column; min-width: 0; }
.cp-it { border-bottom: 1px solid var(--line); min-width: 0; }
.cp-it.first { background: var(--surface); }
.cp-it-row { display: flex; align-items: center; gap: 4px; min-height: var(--row); padding: 2px 4px 2px 2px; min-width: 0; }
.cp-it-n { width: 16px; text-align: right; color: var(--ink-3); font-size: 14px; flex: none; }

.cp-it-name { color: var(--ink); text-decoration: none; font-weight: 700; font-size: var(--fs-s); border-radius: var(--r-s); }
.cp-it-name:hover { text-decoration: underline; }

.cp-firsttag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; font-size: var(--fs-xs); font-weight: 700; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; flex: none; }

.cp-amb .cp-it-row { padding-left: 2px; }
.cp-amb .cp-it-row > .faint.grow { padding-left: 6px; font-size: var(--fs-s); }
.cp-amb .xp-body { border-bottom: 0; border-top: 1px solid var(--line); }

/* Obsidian placeholders: quiet, clearly not working yet */
.cp-later { display: inline-block; padding: 0 5px; border: 1px dashed var(--line-strong); border-radius: 3px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); text-transform: none; letter-spacing: 0; font-family: var(--body); }
.cp-obs { border: 1px dashed var(--line-strong); border-radius: var(--r-m); padding: 0 8px; }
.cp-obs > summary { display: flex; align-items: center; gap: 6px; min-height: var(--ctl); cursor: pointer; font-size: var(--fs-s); font-weight: 700; color: var(--ink-2); list-style: none; }
.cp-obs > summary::-webkit-details-marker { display: none; }
.cp-obs > summary svg { transform: rotate(-90deg); transition: transform .15s; color: var(--ink-3); }
.cp-obs[open] > summary svg { transform: none; }
.cp-obs[open] { padding-bottom: 8px; }
.cp-obs > .hint { margin-bottom: 6px; }
.cp-obs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px 8px; }
.cp-obs-btn { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 6px; }
.cp-obsfield .cp-later { margin-left: 4px; }
.cp-obsfield .hint { margin-top: 1px; }
.cp-side .cp-obs-grid { grid-template-columns: minmax(0, 1fr); }
.cp-own { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--ink-2); flex: none; }
.cp-own svg.i { width: 11px; height: 11px; }
/* Dropping files from the PC: the target is outlined and an insertion line shows where tracks will land. */
.cp-box.cp-fdrop, .cp-scene.cp-fdrop { outline: 2px dashed var(--accent); outline-offset: 1px; }
.cp-it.cp-ins-before { box-shadow: inset 0 3px 0 var(--accent); }
.cp-box.cp-ins-end .cp-items { box-shadow: 0 3px 0 var(--accent); }

/* Keeps the hidden ' (Track)' text inside its link, so it cannot widen the page at narrow widths. */
.cp-it-name { position: relative; }

/* Library view (lb-): Filters | Tracks | Details. */
#view[data-view="library"] { position: relative; }
.lb-head .lb-count { font-size: var(--fs-s); }
.lb-drophint { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.lb-head .btn.primary svg.i:last-child { margin-right: -3px; opacity: .8; }
.lb-body { padding: 8px; }
.lb-grid { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); gap: 8px; }
.lb-grid > .pane, .lb-grid > .col { min-height: 0; min-width: 0; }

/* Collapsed side panes fold into a 34 px strip with the title running down it. */
.pane.lb-strip.collapsed { flex: 1 1 auto !important; }
.lb-strip > header { writing-mode: vertical-rl; flex: 1; min-height: 0; padding: 4px 0; gap: 6px; align-items: center; border-bottom: 0; }
.lb-strip .pane-toggle { height: auto; width: var(--ctl-s); padding: 6px 0; max-width: none; max-height: 55%; }
.lb-strip .pane-summary { font-size: var(--fs-xs); }
.lb-strip .pane-actions { gap: 2px; }

/* Mid width: Filters sits above the list and never takes more than about half the column. */
.lb-mid .lb-filters:not(.collapsed), .lb-narrow .lb-filters:not(.collapsed) { flex: 0 1 auto; max-height: 48%; }
.lb-mid .lb-f, .lb-narrow .lb-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; }

/* ---------- Filters ---------- */
.lb-f { display: flex; flex-direction: column; gap: 12px; }
.lb-fg { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lb-fh { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font: 700 var(--fs-xs)/1.2 var(--body); color: var(--ink-2); letter-spacing: .03em; }
.lb-kind { align-self: flex-start; }
.lb-newbtn { justify-content: flex-start; width: 100%; max-width: 260px; font-weight: 700; }
.lb-newbtn .lb-l { text-align: left; }
.lb-fchip svg.i { width: 12px; height: 12px; }
.lb-n { font-size: var(--fs-xs); color: var(--ink-3); margin-left: 1px; }
button.chip[aria-pressed="true"] .lb-n { color: var(--ink-2); }
.lb-erange { display: flex; gap: 8px; align-items: center; font-size: var(--fs-s); color: var(--ink-2); }
.lb-erange label { display: inline-flex; align-items: center; gap: 5px; }
.lb-sel { width: auto; height: var(--ctl-s); padding: 0 4px; font-size: var(--fs-s); }
.lb-folders { list-style: none; display: flex; flex-direction: column; gap: 1px; }
.lb-folders button { display: flex; align-items: center; gap: 6px; width: 100%; height: var(--ctl-s); padding: 0 6px; border: 0; border-radius: var(--r-s); background: transparent; color: var(--ink-2); cursor: pointer; font-size: var(--fs-s); text-align: left; }
.lb-folders button:hover { background: var(--surface-2); color: var(--ink); }
.lb-folders button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); font-weight: 700; }
.lb-folders .sub button { padding-left: 22px; }

/* ---------- Tracks ---------- */
.lb-tracks > .pane-body { display: flex; flex-direction: column; overflow: hidden; container: lbt / inline-size; }
.lb-tools { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex: none; }
.lb-tools .search .input { height: var(--ctl-s); font-size: var(--fs-s); }
.lb-sortl { flex: none; }
.lb-guide { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: var(--fs-s); flex: none; }
.lb-guide > svg.i { color: var(--accent-text); }
.lb-guide a { color: var(--ink); font-weight: 700; }
.lb-bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex: none; }
.lb-bn { font-size: var(--fs-s); margin-right: 4px; }
.lb-scroll { flex: 1; min-height: 0; overflow: auto; }
.lb-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px 8px; border-top: 1px solid var(--line); flex: none; }
.lb-foot .kbd { font-size: 10px; padding: 1px 4px; }

.lb-table { table-layout: fixed; }
.lb-table th { padding: 4px 6px; }
.lb-table td { padding: 3px 6px; height: 34px; }
.lb-table .lb-c-ck { width: 30px; padding-left: 8px; padding-right: 2px; }
.lb-table td.lb-c-ck { cursor: pointer; }
.lb-table th.lb-c-tags { width: 31%; }
.lb-table th.lb-c-en { width: 52px; }
.lb-table th.lb-c-dur { width: 50px; }
.lb-table th.lb-c-pv { width: 62px; }
.lb-table td.lb-c-dur { color: var(--ink-2); }
.lb-table td.lb-c-pv { padding: 0 4px; }
.lb-table tbody tr { cursor: pointer; }
.lb-table tbody tr[aria-selected="true"] td { background: var(--accent-soft); }
.lb-table tbody tr[aria-selected="true"] td:first-child { box-shadow: none; }
.lb-table tbody tr.lb-open td { background: var(--surface-3); }
.lb-table tbody tr.lb-open td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.lb-table tbody tr:focus-visible { outline: none; }
.lb-table tbody tr:focus-visible td { box-shadow: inset 0 2px 0 var(--focus), inset 0 -2px 0 var(--focus); }
.lb-table tbody tr:focus-visible td:first-child { box-shadow: inset 2px 2px 0 var(--focus), inset 0 -2px 0 var(--focus); }
.lb-table tbody tr:focus-visible td:last-child { box-shadow: inset -2px 2px 0 var(--focus), inset 0 -2px 0 var(--focus); }
.lb-emptyrow td { height: auto; cursor: default; }
.lb-tl { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.lb-t1 { font-weight: 700; color: var(--ink); line-height: 1.25; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; min-width: 0; flex: 0 1 auto; }
.lb-t1.untitled { font-weight: 400; font-style: italic; color: var(--ink-2); }
.lb-t2 { font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.25; }
.lb-src { color: var(--ink-3); }
.lb-notitle { font-size: 10.5px; line-height: 14px; padding: 0 5px; border: 1px dashed var(--line-strong); border-radius: 3px; color: var(--ink-2); white-space: nowrap; }
.lb-newb { flex: none; height: 16px; font-size: 10px; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent); }
.lb-chips { display: flex; gap: 3px; min-width: 0; overflow: hidden; }
.lb-chip { min-width: 44px; flex: 0 1 auto; }
.lb-more { flex: none; }
.lb-none { color: var(--ink-3); font-style: italic; font-size: var(--fs-xs); }
.lb-pv svg.i { color: var(--preview); }
.lb-pv[aria-pressed="true"] { background: color-mix(in srgb, var(--preview) 22%, transparent); }
/* Narrower list: artist goes first, then energy, then tags; fewer chips fit, the "+n" counts the rest. */
@container lbt (max-width: 359px) { .lb-c-tags { display: none; } }

/* ---------- Details ---------- */
.lb-d { display: flex; flex-direction: column; gap: 10px; }
.lb-dempty { color: var(--ink-2); font-size: var(--fs-s); padding: 4px 2px; gap: 8px; }
.lb-warn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: -6px; font-size: var(--fs-xs); color: var(--ink-2); }
.lb-names { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: var(--fs-s); }
.lb-names dt { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); padding-top: 1px; }
.lb-names dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.lb-from { display: block; font-size: var(--fs-xs); color: var(--ink-3); }
.lb-path { display: block; }
.lb-pathbtns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.lb-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lb-pvbtn svg.i { color: var(--preview); }
.lb-pvbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--preview) 22%, transparent); border-color: var(--preview); }
.lb-sec { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--line); padding-top: 8px; }
.lb-h { font: 700 var(--fs-xs)/1.2 var(--body); color: var(--ink-2); text-transform: uppercase; letter-spacing: .07em; }
.lb-hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lb-tg > .seg { justify-self: start; }
.lb-tg { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px; align-items: start; }
.lb-tgl { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); padding-top: 5px; }
.lb-d .chip { height: var(--ctl-s); }
.lb-d .chip .x { width: 24px; height: 24px; margin-right: -7px; }
.lb-pick svg.i, .lb-tsc svg.i { width: 12px; height: 12px; }
.lb-cbx { width: 140px; max-width: 100%; }
.lb-cbx.open { flex-basis: 100%; width: 100%; max-width: 280px; }
.lb-cbxin.input { height: var(--ctl-s); font-size: var(--fs-s); border-style: dashed; background: transparent; }
.lb-cbxin.input:focus { border-style: solid; background: var(--bg); }
.lb-lbx { list-style: none; margin: 3px 0 0; padding: 3px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface-2); box-shadow: var(--shadow); max-height: 220px; overflow: auto; }
.lb-lbx [role="option"] { display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 0 7px; border-radius: var(--r-s); cursor: pointer; font-size: var(--fs-s); }
.lb-lbx [role="option"]:hover { background: var(--surface-3); }
.lb-lbx [role="option"][aria-selected="true"] { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--accent); }
.lb-odot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.lb-odot.mood { background: var(--mood); } .lb-odot.motif { background: var(--motif); } .lb-odot.scene { background: var(--scenetype); }
.lb-d textarea.input { min-height: 48px; font-size: var(--fs-s); }
.lb-pls { list-style: none; display: flex; flex-direction: column; }
