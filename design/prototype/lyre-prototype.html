.lb-pls li { display: flex; align-items: center; gap: 7px; min-height: 28px; border-bottom: 1px solid var(--line); font-size: var(--fs-s); min-width: 0; }
.lb-pls li:last-child { border-bottom: 0; }
.lb-pls a { color: var(--ink); font-weight: 700; text-decoration: none; min-width: 0; flex: 0 1 auto; display: flex; align-items: center; min-height: 24px; }
.lb-pls a:hover { text-decoration: underline; }
.lb-plk { flex: 1; min-width: 0; }
.lb-pls li { padding: 3px 0; }
.lb-used li { flex-wrap: wrap; row-gap: 0; padding: 3px 0; }
.lb-used .hint { flex-basis: 100%; }

/* Add tracks menu items have two lines. */
.menu .lb-mi { align-items: center; padding: 5px 8px; }
.menu .lb-mi b { display: block; font-size: var(--fs-s); }
.menu .lb-mi .hint { display: block; }

/* Bulk Tag… sheet */
.lb-tsintro { margin-bottom: 8px; font-size: var(--fs-s); }
.lb-tsg { border: 0; padding: 0; margin: 12px 0 0; min-width: 0; }
.lb-tsg legend { padding: 0; margin-bottom: 5px; font: 700 var(--fs-xs)/1.2 var(--body); color: var(--ink-2); letter-spacing: .03em; }
.lb-tsc:disabled { opacity: .45; cursor: not-allowed; }
.lb-cov { font-size: 10px; color: var(--ink-3); padding-left: 3px; border-left: 1px solid var(--line); margin-left: 2px; }
.lb-tsc[aria-pressed="true"] .lb-cov { color: var(--ink-2); }
.lb-tsnew { display: flex; gap: 4px; margin-top: 6px; max-width: 300px; }
.lb-tsnew .input { height: var(--ctl-s); font-size: var(--fs-s); }

/* Dropping files on the page */
#view.lb-drop::after { content: "Drop to add these to your library"; position: absolute; inset: 6px; z-index: 20; display: grid; place-items: center; border: 2px dashed var(--accent); border-radius: var(--r-l);
  background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--ink); font-weight: 700; font-size: var(--fs-l); pointer-events: none; }

@container app (min-width: 901px) { .lb-drop2 { display: none; } }
@container app (max-width: 900px) { .lb-drophint { display: none; } }

/* Review fixes: every control at least 24 x 24 px. */
.lb-fh, .lb-h { margin: 0; }
.seg.lb-seg24 button { height: 24px; min-width: 24px; justify-content: center; }
.lb-ckl { display: inline-grid; place-items: center; width: 24px; height: 24px; cursor: pointer; }
.lb-table .lb-c-ck { width: 34px; padding-left: 6px; }
.lb-table td { padding-top: 4px; padding-bottom: 4px; }
.lb-newb { margin-top: 1px; }

/* Round 3: row buttons, kind markers, how a scene uses the track. */
.lb-rowbtns { display: flex; gap: 2px; justify-content: flex-end; }
.lb-km { display: inline-flex; align-items: center; gap: 3px; flex: none; height: 16px; padding: 0 4px; margin-top: 1px; border: 1px solid var(--line-strong); border-radius: 3px; font-size: 10px; font-weight: 700; color: var(--ink-2); }
.lb-km .lane-dot { width: 6px; height: 6px; }
.lb-used li { column-gap: 6px; }
.lb-how { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--ink-2); }
.lb-how.direct { color: var(--ink); font-weight: 700; }
.lb-how + .lb-how { padding-left: 6px; border-left: 1px solid var(--line); }
@container lbt (max-width: 560px) { .lb-c-en { display: none; } }
.lb-kind { align-self: stretch; display: flex; max-width: 300px; }
.lb-kind button { flex: 1 1 auto; padding: 0 6px; }
.lb-prof { display: flex; align-items: flex-start; gap: 6px; margin-top: -4px; font-size: var(--fs-xs); color: var(--ink-2); }
.lb-prof svg.i { margin-top: 1px; color: var(--ink-3); }
/* Sticky header covers the rows scrolling under it (collapsed borders do not stick, so the table uses separate ones). */
.lb-table { border-collapse: separate; border-spacing: 0; }
.lb-table thead th { z-index: 3; background: var(--surface); box-shadow: 0 1px 0 var(--line-strong); }
.lb-air { flex: none; height: 16px; font-size: 10px; }
.lb-km { white-space: nowrap; }
.lb-airline { display: flex; align-items: center; gap: 6px; min-width: 0; margin-top: 1px; }
.lb-airline > .lb-t2 { min-width: 0; flex: 1; }

/* Round 4: one line per row, neutral markers, less on screen. */
.lb-table td { height: 30px; padding-top: 2px; padding-bottom: 2px; }
.lb-tl { align-items: center; gap: 6px; }
.lb-t1 { display: block; -webkit-line-clamp: unset; white-space: nowrap; text-overflow: ellipsis; flex: 0 1 auto; }
.lb-tl .lb-t2 { flex: 0 10 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); }
.lb-table th.lb-c-tags { width: 24%; }
.lb-table th.lb-c-pv { width: 88px; }
.lb-more { flex: none; font-size: var(--fs-xs); color: var(--ink-3); padding-left: 2px; }
.lb-chips, .lb-c-tags { white-space: nowrap; }
td.lb-c-tags { overflow: hidden; }
td.lb-c-tags > .chip { max-width: calc(100% - 26px); }
.lb-newb { border-color: var(--line-strong); background: transparent; color: var(--ink-2); }
.lb-km { border-color: var(--line); }
.lb-warn { margin-top: -6px; }
.lb-dempty p:first-child { color: var(--ink-2); }
@container lbt (max-width: 699px) { .lb-tl .lb-t2 { display: none; } }
@container lbt (max-width: 479px) { .lb-table th.lb-c-tags { width: 30%; } }

/* Pad boards: list (#/boards) and editor (#/board/<id>). Prefix pb-.
   Pad colours (--pc, from L.colors) are identities: a left stripe and an icon tile. Text keeps the theme's ink. */
.pb-sub { font-size: var(--fs-s); }

/* ---------- list of boards ---------- */
.pb-cards { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--gap); }
.pb-card { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); min-width: 0; }
.pb-card:hover { border-color: var(--line-strong); }
.pb-card-main { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); text-decoration: none; border-radius: var(--r-s); }
.pb-card-main:hover .pb-card-name { text-decoration: underline; }
.pb-card-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.pb-card-name { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: calc(var(--fs-l) * var(--display-scale)); }
.pb-card-size { font-size: var(--fs-xs); color: var(--ink-2); }
.pb-card-used { font-size: var(--fs-xs); color: var(--ink-2); display: flex; gap: 6px; min-width: 0; }
.pb-card-used .pb-used-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pb-card-acts { display: flex; align-items: center; gap: 4px; margin-top: auto; }
.pb-card-acts a.btn { text-decoration: none; }
.pb-mini { display: grid; gap: 2px; flex: none; padding: 4px; border-radius: var(--r-s); background: var(--bg); border: 1px solid var(--line); }
.pb-cell { display: block; width: 10px; height: 8px; border-radius: 2px; border: 1px solid var(--line-strong); }
.pb-cell.on { background: var(--pc); border-color: var(--pc); }
.pb-uselist { padding-left: 18px; }

/* New board sheet */
.pb-fs { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pb-fs > legend { padding: 0; margin-bottom: 4px; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 700; letter-spacing: .02em; }
.pb-cur { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.pb-qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px; }
.pb-qs-opt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: var(--ctl); padding: 3px 8px; border: 1px solid var(--line); border-radius: var(--r-m); cursor: pointer; font-weight: 700; font-size: var(--fs-s); }
.pb-qs-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pb-qs-opt .hint { flex-basis: 100%; padding-left: 22px; font-weight: 400; }
.pb-nb-custom { align-items: flex-end; }
.pb-nb-custom .field { width: 90px; }
.pb-x { padding-bottom: 6px; color: var(--ink-3); }

/* ---------- editor layout ---------- */
.pb-body { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; overflow: hidden; }
.pb-ed { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, 36%); gap: var(--gap); }
.pb-left { overflow: auto; }
.pb-left > .pane, .pb-left > .pane[data-size] { flex: none; }
.pb-left.has-max > .pane.maxed { flex: 1 1 auto; }
.viewhead a.btn { text-decoration: none; }

/* Toolbar: name, size steppers, quick sizes, count */
.pb-tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.pb-name { max-width: 360px; }
.pb-sizes { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-width: 0; }
.pb-step { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.pb-step-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); margin-right: 2px; }
.pb-step-v { min-width: 16px; text-align: center; font-size: var(--fs-l); }
.pb-count { font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; }
.pb-count b { color: var(--ink); font-size: var(--fs); }
.pb-msg { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 8px; margin-bottom: 8px; border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); border-radius: var(--r-m); background: var(--surface-2); font-size: var(--fs-s); }
.pb-msg > svg { color: var(--accent-text); }

/* The grid */
.pb-grid { display: grid; gap: 6px; }
.pb-slot { min-width: 0; container-type: inline-size; container-name: pbslot; border-radius: var(--r-m); }
.pb-slot.pb-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
.pb-pad, .pb-empty { width: 100%; height: 62px; border-radius: var(--r-m); cursor: pointer; text-align: left; min-width: 0; }
/* A pad tile: the slot draws the frame and stripe; inside sit the pad button (select, drag) and a Preview button. */
.pb-has { position: relative; display: flex; height: 62px; overflow: hidden; border: 1px solid var(--line-strong); background: var(--surface-2); --stripe: var(--pc); }
.pb-has::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe); pointer-events: none; }
.pb-has:hover { background: var(--surface-3); }
.pb-has.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.pb-pad { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; padding: 5px 2px 5px 10px; border: 0; background: transparent; color: var(--ink); border-radius: var(--r-m); }
.pb-tile-pv { display: flex; align-items: flex-end; padding: 0 3px 3px 0; flex: none; }
.pb-tile-pv .pv { border-color: transparent; background: transparent; color: var(--ink-3); }
.pb-tile-pv .pv:hover { color: var(--preview); background: var(--surface-3); }
.pb-tile-pv .pv[aria-pressed="true"] { color: var(--preview); border-color: var(--preview); background: color-mix(in srgb, var(--preview) 18%, transparent); }
.pb-has.on::after, .pb-has.pv::after { content: ''; position: absolute; left: 4px; right: 0; bottom: 0; height: 3px; background: var(--fx); animation: pb-pulse 1s ease-in-out infinite alternate; pointer-events: none; }
.pb-has.pv:not(.on)::after { background: var(--preview); animation: none; }
.pb-slot:has(.dragging) { opacity: .5; }
@keyframes pb-pulse { from { opacity: .45; } to { opacity: 1; } }
.pb-pad-label { font-size: var(--fs-s); font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; min-width: 0; }
.pb-pad-meta { display: flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: var(--fs-xs); min-width: 0; }
.pb-pad-meta .kbd { padding: 1px 4px; }
.pb-mode { display: inline-flex; color: var(--ink-3); opacity: .8; }
.pb-mode svg.i { width: 12px; height: 12px; }
.pb-lvl { flex: none; width: 52px; font-size: var(--fs-xs); color: var(--ink-3); }
.pb-playing { margin-left: auto; color: var(--ink); font-weight: 700; }
.pb-empty { display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px dashed var(--line); background: transparent; color: var(--ink-3); font-size: var(--fs-xs); font-weight: 700; }
.pb-empty:hover, .pb-slot.pb-over .pb-empty { border-color: var(--line-strong); color: var(--ink); background: var(--surface-2); }
@container pbslot (max-width: 84px) {
  .pb-pad { padding-left: 8px; }
  .pb-tile-pv { padding-right: 1px; }
  .pb-mode, .pb-playing { display: none; }
  .pb-empty-t { display: none; }
}
.pb-help { margin-top: 6px; }
/* Parchment: deepen the stripe so it shows on paper; the tile keeps its light colour with a dark icon. */
[data-theme="parchment"] .pb-has { --stripe: color-mix(in srgb, var(--pc) 55%, #2a1d0c); }

/* Spare pads */
.pb-spare { min-height: 40px; border-radius: var(--r-m); }
.pb-spare.pb-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.pb-spare .lrow { gap: 4px; padding-left: 0; position: relative; }
.pb-spare .lrow::before { content: ''; align-self: stretch; width: 4px; flex: none; margin-right: 4px; background: var(--pc); border-radius: 0 2px 2px 0; }
[data-theme="parchment"] .pb-spare .lrow::before { background: color-mix(in srgb, var(--pc) 55%, #2a1d0c); }
.pb-sp-pick { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; height: var(--ctl-s); padding: 0 4px; border: 0; background: transparent; color: var(--ink); font-weight: 700; font-size: var(--fs-s); cursor: pointer; border-radius: var(--r-s); text-align: left; }
.pb-sp-pick .pb-spare-empty { padding: 8px; font-size: var(--fs-s); color: var(--ink-2); }
/* "Not used yet." in the Used in box sits off the box edge, as in Spare pads. */
[data-pane="pb-used"] .pb-spare-empty { padding: 8px; font-size: var(--fs-s); color: var(--ink-2); }

/* Pad editor */
.pb-ed-body { display: flex; flex-direction: column; gap: 10px; }
.pb-testrow { display: flex; flex-wrap: wrap; gap: 6px; }
.pb-prev { color: var(--ink); border-color: var(--preview); background: color-mix(in srgb, var(--preview) 18%, var(--surface-2)); }
.pb-prev:hover { background: color-mix(in srgb, var(--preview) 28%, var(--surface-2)); }
.pb-prev svg.i { color: var(--preview); }
.pb-prev[aria-pressed="true"] { background: color-mix(in srgb, var(--preview) 30%, var(--surface-2)); border-color: var(--preview); }
.pb-testrow { align-items: center; }
.pb-seg-wide { display: flex; width: 100%; }
.pb-seg-wide button { flex: 1; justify-content: center; min-width: 0; padding: 0 4px; }
.pb-files { list-style: none; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-m); }
.pb-files li { display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 2px 0 8px; font-size: var(--fs-s); border-bottom: 1px solid var(--line); min-width: 0; }
.pb-files li:last-child { border-bottom: 0; }
.pb-files svg.i { color: var(--ink-3); }
.pb-filerow { flex-wrap: wrap; gap: 6px; }
.pb-order { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.pb-order-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.pb-none { font-size: var(--fs-s); color: var(--ink-2); padding: 2px 0; }
.pb-modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.pb-modes .btn { justify-content: flex-start; }
.pb-modehelp { font-size: var(--fs-s); color: var(--ink-2); }
.pb-keycap { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl); padding: 0 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); background: var(--bg); color: var(--ink); cursor: pointer; font-size: var(--fs-s); min-width: 0; }
.pb-keycap.capturing { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.pb-warn { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 4px 4px 4px 8px; border: 1px solid var(--warn); border-radius: var(--r-m); font-size: var(--fs-s); color: var(--ink); }
.pb-warn > svg { color: var(--warn); }
.pb-swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.pb-sw, .pb-ic { position: relative; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--r-m); border: 1px solid transparent; cursor: pointer; }
.pb-vh { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.pb-sw-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--pc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 55%, #000); }
.pb-sw:hover, .pb-ic:hover { background: var(--surface-2); }
.pb-sw:has(input:checked), .pb-ic:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pb-sw:has(input:checked) .pb-sw-dot::after { content: ''; }
.pb-sw:has(input:checked) .pb-sw-dot { box-shadow: inset 0 0 0 2px var(--surface), 0 0 0 1px var(--ink); }
.pb-sw:has(input:focus-visible), .pb-ic:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 1px; }
.pb-icons { display: grid; grid-template-columns: repeat(auto-fill, 28px); gap: 2px; }
.pb-ic { color: var(--ink-2); }
.pb-ic:has(input:checked) { color: var(--ink); }
.pb-levels { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.pb-levels .field.grow { min-width: 140px; }
.pb-levels input[type="range"] { width: 100%; height: var(--ctl); margin: 0; }
.pb-levels output { color: var(--ink); margin-left: 4px; }
.pb-fade { width: 120px; }

/* Used in */
.pb-uselink { color: var(--ink); text-decoration: none; font-size: var(--fs-s); }
.pb-uselink:hover { text-decoration: underline; }

/* Narrow: one column, grid then spare pads then the pad editor then Used in; the page scrolls. */
@container app (max-width: 900px) {
  .pb-body { overflow: auto; }
  .pb-ed { display: flex; flex-direction: column; flex: none; }
  .pb-ed > .col { display: contents; }
  .pb-ed .pane { flex: none !important; }
  .pb-ed .pane-body { overflow: visible; }
  .pb-ed [data-pane="pb-pad"] { order: 3; }
  .pb-ed [data-pane="pb-used"] { order: 4; }
  .pb-ed .col.has-max > .pane:not(.maxed) { display: none; }
}

/* Round 3: list search and filters; spare pads explained; library sounds */
.pb-ltools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
.pb-lsearch { flex: 1 1 200px; max-width: 340px; }
.pb-camp { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.pb-camp select.input { width: auto; max-width: 200px; height: var(--ctl-s); font-size: var(--fs-s); font-weight: 400; }
.pb-card-acts .pv { flex: none; }
.pb-spare-intro { padding: 6px 8px; font-size: var(--fs-s); color: var(--ink-2); border-bottom: 1px solid var(--line); }
.pb-kbd-off { text-decoration: line-through; color: var(--ink-3); }
.pb-files .pv { margin-left: 2px; }
.pb-has .pb-pad:focus-visible, .pb-tile-pv .pv:focus-visible { outline-offset: -2px; }

/* Live view (#/live). Prefix lv-. Columns are chosen in live.js from the width of #app (1, 2 or 3). */
.lv { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- top strip ---------- */
.lv-top { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--line); min-width: 0; flex: none;
  background: color-mix(in srgb, var(--surface) 55%, var(--bg)); }
.lv-sess { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl); padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--r-m);
  background: var(--surface-2); color: var(--ink); cursor: pointer; min-width: 0; flex: 0 1 auto; font-size: var(--fs-s); font-weight: 700; }
.lv-sess:hover { background: var(--surface-3); }
.lv-sess > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lv-sess-c { color: var(--ink-2); font-weight: 400; flex: 0 3 auto; }
.lv-sess-s { flex: 0 1 auto; }
.lv-sess-sep { color: var(--ink-3); flex: none !important; }
.lv-sess > svg { color: var(--ink-2); }
.lv-dcs { display: flex; gap: 4px; flex: none; }
.lv-dc { display: inline-flex; align-items: center; gap: 5px; height: var(--ctl-s); padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
  color: var(--ink-2); font-size: var(--fs-xs); cursor: pointer; white-space: nowrap; }
.lv-dc:hover { background: var(--surface-2); }
.lv-dc b { color: var(--ink); }
.lv-dc-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-3); flex: none; }
.lv-dc.on { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
.lv-dc.on .lv-dc-dot { background: var(--ok); border-color: var(--ok); }
.lv-warn { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; color: var(--warn); white-space: nowrap; }
.lv-top .kbd { margin-right: 2px; }
@container app (max-width: 900px) { .lv-sess-c, .lv-sess-sep { display: none; } }

/* ---------- columns ---------- */
.lv-cols { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); gap: 8px; padding: 8px; }
.lv-cols.c2 { grid-template-columns: minmax(0, 38fr) minmax(0, 62fr); }

.lv-cols.c1 { display: block; overflow: auto; }

.lv-cols.c1 > .col > .pane > .pane-body { overflow: visible; }
.lv-cols.c1 .lv-sticky { position: static; }
.lv-cols.c1 > .col.has-max { height: 100%; }
.lv-cols.c1 > .col.has-max > .pane > .pane-body { overflow: auto; }
.lv .pane-body { overscroll-behavior: contain; }
.lv-sticky { position: sticky; top: 0; z-index: 2; background: var(--surface); }

/* ---------- On air ---------- */
.lv-onair { display: flex; flex-direction: column; container: lvair / inline-size; }
.lv-lane { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; grid-template-areas: "l t c" "l p c" "l e e" "l s s"; gap: 4px 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.lv-lane-l { grid-area: l; align-self: start; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding-top: 2px; }
.lv-lane-m { display: contents; }
.lv-lane-t { grid-area: t; min-width: 0; }
.lv-lane-pr { grid-area: p; min-width: 0; }
.lv-lane-sub { grid-area: s; }
.lv-lane-c { grid-area: c; }
@container lvair (max-width: 500px) {
  .lv-lane { grid-template-areas: "l t t" "l p c" "l e e" "l s s"; }
}
.lv-lane-n { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.lv-lane-t { font-weight: 700; line-height: 20px; }
.lv-lane-pr { display: flex; align-items: center; gap: 8px; }
.lv-lane-pr .progress { flex: 1; }
.lv-time { font-size: var(--fs-xs); color: var(--ink-2); min-width: 62px; text-align: right; }
.lv-lane-sub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-xs); color: var(--ink-2); }
.lv-lane-sub .chip { flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.lv-upnext { flex: 1; }
.lv-upnext b { color: var(--ink); }
.lv-lane-c { display: flex; gap: 3px; align-items: center; }
.lv-lane.lv-a { padding-top: 5px; padding-bottom: 5px; }
.lv-a .lv-lane-l { flex-direction: row; align-items: center; flex-wrap: wrap; }
.lv-a .lv-lane-t { font-weight: 400; font-size: var(--fs-s); }
.lv-a .progress { height: 3px; }
.lv-lane.empty .lv-lane-pr { display: none; }
.lv-queue { display: flex; align-items: center; gap: 6px; padding: 0 8px 6px 82px; flex-wrap: wrap; border-bottom: 1px solid var(--line); min-width: 0; margin-top: -2px; }
.lv-queue ol { list-style: none; flex: 1; }
.lv-q-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); flex: none; }
.lv-q-item { max-width: 210px; padding-right: 2px; gap: 5px; }
.lv-q-item .num { color: var(--ink-3); }
.lv-q-item .x { width: 20px; height: 20px; }
.lv-line { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 3px 8px; border-bottom: 1px solid var(--line); font-size: var(--fs-s); min-width: 0; }
.lv-line:last-child { border-bottom: 0; }
.lv-line-l { width: 66px; flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.lv-pv { background: color-mix(in srgb, var(--preview) 9%, var(--surface)); box-shadow: inset 3px 0 0 var(--preview); }
.lv-pv .lv-line-l svg { color: var(--preview); }
.lv-pv-m { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

/* ---------- Scenes ---------- */
.lv-sc-top { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.lv-nextsc { width: 100%; justify-content: flex-start; flex: none; }
.lv-nextsc .ellipsis { flex: 1; text-align: left; }
.lv-nextsc .kbd { background: transparent; color: inherit; border-color: currentColor; }
.lv-scenes { list-style: none; }
.lv-sc { display: flex; flex-direction: column; gap: 2px; padding: 5px 8px 6px; border-bottom: 1px solid var(--line); min-width: 0; }
.lv-sc.now { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--onair); }
.lv-sc.next { box-shadow: inset 3px 0 0 var(--accent); }
.lv-sc.done .lv-sc-name { color: var(--ink-2); font-weight: 400; }
.lv-sc-1 { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: var(--ctl-s); }
.lv-sc-n { width: 16px; flex: none; text-align: right; color: var(--ink-3); font-size: var(--fs-s); }
.lv-sc-name { flex: 1; font-weight: 700; }
.lv-sc-when, .lv-sc-chips, .lv-sc-notes { margin-left: 22px; }
.lv-sc-when { font-size: var(--fs-xs); color: var(--ink-2); }
.lv-sc-chips { flex-wrap: nowrap; overflow: hidden; }
.lv-sc-chips .chip { min-width: 0; flex: 0 1 auto; }
.lv-sc-chips .chip:nth-child(2):not(.amb) { flex: none; }
.lv-sc-notes { display: flex; gap: 6px; align-items: flex-start; margin-top: 3px; padding: 3px 4px 3px 7px; border-left: 2px solid var(--line-strong); font-size: var(--fs-xs); color: var(--ink); }
.lv-sc-notes-t { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 16px; padding-top: 3px; }
.lv-sc-notes.open .lv-sc-notes-t { display: block; }
.badge.lv-nextb, .badge.lv-qb { background: transparent; border: 1px solid var(--accent); color: var(--accent-text); }
.badge.lv-silent { background: transparent; border: 1px solid var(--line-strong); color: var(--ink-2); }
.lv-more { flex: none; height: var(--ctl-s); padding: 0 6px; border: 0; border-radius: var(--r-s); background: transparent; color: var(--accent-text); font-size: var(--fs-xs); font-weight: 700; cursor: pointer; }
.lv-more:hover { background: var(--surface-3); text-decoration: underline; }

/* ---------- Scene music ---------- */
.lv-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
.lv-pick-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); flex: none; }
.lv-tabs { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.lv-tab { display: inline-flex; align-items: center; min-width: 0; max-width: 230px; height: var(--ctl-s); padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: transparent; color: var(--ink-2); font-size: var(--fs-s); font-weight: 700; cursor: pointer; }
.lv-tab:hover { background: var(--surface-2); color: var(--ink); }
.lv-tab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.lv-pick-more { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; min-width: 0; }
.lv-pick-menu { flex: 0 1 auto; min-width: 0; max-width: 240px; gap: 4px; }
.lv-pick-menu .faint { font-weight: 400; }
.lv-pick-none { font-size: var(--fs-xs); align-self: center; }
.lv-plhead { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: var(--fs-s); min-width: 0; }

/* ---------- track rows ---------- */
.lv-list { list-style: none; container: lvlist / inline-size; }
.lv-trk { border-bottom: 1px solid var(--line); min-width: 0; }
.lv-trk:last-child { border-bottom: 0; }
.lv-trk-r { display: flex; align-items: center; gap: 6px; min-height: var(--row); padding: 2px 4px 2px 8px; min-width: 0; }
.lv-trk-r:hover { background: var(--surface-2); }
.lv-trk.on { background: var(--surface-3); box-shadow: inset 3px 0 0 var(--onair); }
.lv-trk.on .lv-trk-r:hover { background: transparent; }
.lv-trk.open { box-shadow: inset 3px 0 0 var(--accent); }
.lv-trk.on.open { box-shadow: inset 3px 0 0 var(--onair); }
.lv-trk .badge { flex: none; }
/* Titles are Nik's descriptive notes: up to two lines, full text in title=. */
.lv-trk-t { flex: 1; min-width: 0; display: flex; align-items: center; min-height: var(--ctl-s); padding: 2px; border: 0; border-radius: var(--r-s); background: transparent; color: var(--ink);
  font-size: var(--fs-s); text-align: left; cursor: pointer; overflow: hidden; }
.lv-trk-t > span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 15px; overflow-wrap: anywhere; }
.lv-trk-t:hover > span { text-decoration: underline; }
.lv-trk-t[aria-expanded="true"] > span { -webkit-line-clamp: unset; display: block; }
.lv-trk.on .lv-trk-t { font-weight: 700; }
.lv-trk-chips { flex: none; flex-wrap: nowrap; overflow: hidden; }
.lv-trk-chips .chip { height: 18px; padding: 0 6px; }
.lv-dur { flex: none; width: 32px; text-align: right; font-size: var(--fs-xs); color: var(--ink-2); }
.lv-trk-acts { display: flex; gap: 1px; flex: none; }
.lv-trk-acts .closer { color: var(--ink-2); }
.lv-trk-acts .closer:hover { color: var(--ink); }
.lv-gap { width: var(--ctl-s); flex: none; }
.lv-pvb[aria-pressed="true"] { color: var(--ink) !important; background: color-mix(in srgb, var(--preview) 28%, transparent); box-shadow: inset 0 0 0 1px var(--preview); }
.lv-trk-d { padding: 2px 8px 8px 12px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); }
.lv-trk-d dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; margin: 0; }
.lv-trk-d dt { color: var(--ink-2); font-weight: 700; }
.lv-trk-d dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@container lvlist (max-width: 1100px) { .lv-trk-chips .chip:nth-child(n+2) { display: none; } }
@container lvlist (max-width: 480px) { .lv-trk-chips { display: none; } }
@container lvlist (max-width: 300px) { .lv-trk .energy { display: none; } }

/* ---------- Off script ---------- */
.lv-off-f { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; }
.lv-off-f .search { flex: 1 1 140px; }
.lv-off-f .search .kbd { position: absolute; right: 6px; pointer-events: none; }
.lv-off-f .search .input { padding-right: 26px; }
.lv-tagrow { padding: 0 8px 6px; }
.lv-tagrow .chip, .lv-taggrp .chip { height: var(--ctl-s); }
.lv-taggrp { display: flex; gap: 6px; padding: 0 8px 6px; align-items: flex-start; }
.lv-taggrp-l { flex: none; width: 70px; padding-top: 4px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.lv-off-count { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 0 8px; font-size: var(--fs-xs); color: var(--ink-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.lv-off-hint { padding: 2px 8px 10px; font-size: var(--fs-s); color: var(--ink-2); }

/* ---------- Pads ---------- */
.lv-pads-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; min-width: 0; }
.lv-boardbtn { flex: 0 1 auto; min-width: 0; max-width: 220px; }
.lv-grid { display: grid; gap: 4px; padding: 0 8px 6px; container: lvgrid / inline-size; }
.lv-pad { display: flex; align-items: center; gap: 5px; height: 36px; min-width: 0; padding: 0 5px 0 10px; border: 1px solid var(--line); border-radius: var(--r-m);
  background: var(--surface-2); color: var(--ink); box-shadow: inset 4px 0 0 var(--pad); font-size: var(--fs-s); font-weight: 700; text-align: left; cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none; }
.lv-pad:hover { background: var(--surface-3); }
.lv-pad > svg:first-child { color: var(--ink-2); }
.lv-pad.on { background: var(--accent-soft); border-color: var(--accent); }
.lv-pad-l { flex: 1; }
.lv-pad-mode { display: inline-flex; color: var(--ink-3); flex: none; }
.lv-pad-on { flex: none; padding: 0 4px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-size: var(--fs-xs); line-height: 16px; }
.lv-pad .kbd { flex: none; }
.lv-pad-empty { height: 36px; border: 1px dashed var(--line); border-radius: var(--r-m); }
.lv-pads-hint { padding: 0 8px 6px; }
@container lvgrid (max-width: 600px) { .lv-pad > svg:first-child { display: none; } .lv-pad { padding-left: 8px; } }
@container lvgrid (max-width: 400px) {
  .lv-pad { gap: 3px; padding-right: 3px; }
  .lv-pad .lv-pad-l { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: var(--fs-xs); line-height: 13px; }
  .lv-pad-mode { display: none; }
  .lv-pad .kbd { padding: 1px 3px; }
}

/* ---------- Undo strip (in On air, about 8 s after a scene change) ---------- */
.lv-undo { position: relative; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 3px 8px 5px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-size: var(--fs-s); min-width: 0; }
.lv-undo .btn { flex: 0 1 auto; min-width: 0; max-width: 70%; }
.lv-undo .btn .ellipsis { min-width: 0; }
.lv-undo-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; }
.lv-undo-bar > span { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }

/* ---------- Keys popover (a disclosure, not a menu) ---------- */
.lv-keyswrap { position: relative; flex: none; }
.lv-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 300px; max-width: calc(100vw - 16px); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: var(--shadow); font-size: var(--fs-s); }
.lv-switch { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.lv-switch input { margin-top: 2px; width: 18px; height: 18px; }
.lv-switch-t { display: flex; flex-direction: column; gap: 1px; }
.lv-switch-t .hint { color: var(--ink-2); }
.lv-keylist { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.lv-keylist li { display: flex; align-items: baseline; gap: 8px; }
.lv-keylist .kbd { flex: none; min-width: 64px; text-align: center; }
.lv-keylist li.lv-off { color: var(--ink-2); text-decoration: line-through; }
.lv-pop > .hint { color: var(--ink-2); }
.lv-allsc { margin: 4px 8px 6px; }
.lv-dc-info { white-space: normal; padding-top: 4px; padding-bottom: 4px; }

/* ---------- Round 3: scene list items, quieter colour ---------- */
.lv-top .mode-switch { flex: none; }
.lv-dc1 { display: none; }
@container app (max-width: 1180px) { .lv-dcs { display: none; } .lv-dc1 { display: inline-flex; } }
.lv-num { flex: none; width: 14px; text-align: right; color: var(--ink-3); font-size: var(--fs-xs); }
.lv-pli { border-bottom: 1px solid var(--line); min-width: 0; }
.lv-pli:last-child { border-bottom: 0; }
.lv-pli.on { background: var(--surface-3); box-shadow: inset 3px 0 0 var(--onair); }
.lv-pli .xp-btn { flex: none; }
.lv-pli-i { color: var(--ink-2); }
.lv-pli-n { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-s); }
.lv-pli-n > b { flex: 0 1 auto; min-width: 0; }
.lv-pli-n > .faint { flex: 0 1 auto; min-width: 0; font-size: var(--fs-xs); }
@container lvlist (max-width: 420px) { .lv-pli-n { flex-direction: column; gap: 0; } }
.lv-sub { border-top: 1px solid var(--line); margin-left: 22px; border-left: 2px solid var(--line-strong); }
.lv-trk.inner .lv-trk-r { padding-left: 8px; }
.lv-trk.inner.on { box-shadow: inset 3px 0 0 var(--onair); }
/* Colour only where it means something: chips and energy are neutral here. */
.lv .chip { color: var(--ink-2); border-color: var(--line-strong); background: transparent; }
.lv .chip .lane-dot { width: 7px; height: 7px; border-radius: 50%; }
.lv button.chip.lv-mood { background: var(--surface); }
.lv button.chip.lv-mood[aria-pressed="true"] { background: var(--surface-3); border-color: var(--ink-2); color: var(--ink); font-weight: 700; }
.lv .energy span.on { background: var(--ink-2); }
.lv .lv-more { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.lv-tagx { margin-left: auto; color: var(--ink-2); border: 1px solid var(--line-strong); }
.lv-bseg { min-width: 0; max-width: 60%; }
.lv-bseg button { min-width: 0; max-width: 160px; }
.lv-boardbtn[aria-pressed="true"] { background: var(--surface-3); border-color: var(--ink-2); }
.lv-pick .lv-tab { flex: none; }
.badge.lv-qb { border-color: var(--ink-2); color: var(--ink); }
.lv-tab[aria-pressed="true"], .lv-bseg button[aria-pressed="true"] { background: var(--surface-3); border-color: var(--ink-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink-2); }
.lv-trk.open { box-shadow: inset 3px 0 0 var(--ink-3); }
.lv-pad.on { background: var(--surface-3); border-color: var(--ink-2); }
.lv-pad-on { background: var(--ink); color: var(--surface); }
.lv-pads-bar { flex-wrap: wrap; }
.lv-pads-bar .hint:empty { display: none; }
.lv-pads-bar .lv-boardbtn { min-width: 124px; }
.lv-bseg { max-width: 100%; }

.lv-lane-end { grid-area: e; display: flex; align-items: center; gap: 5px; min-width: 0; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-trk-ap { display: flex; align-items: center; gap: 6px; }

/* ---------- Round 3 review: red only for On air; accent for Now and the Next scene button ---------- */
.badge.lv-nowb { background: transparent; border: 1.5px solid var(--accent); color: var(--accent-text); }
.badge.lv-nextb { border-color: var(--line-strong); color: var(--ink-2); }
.lv-sc.now { box-shadow: inset 3px 0 0 var(--accent); }
.lv-sc.next { box-shadow: inset 3px 0 0 var(--line-strong); }
.lv-undo { background: var(--surface-2); }
.lv-undo-bar > span { background: var(--ink-3); }
.lv .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink-2); }
/* Effects lane: a lime that stays clear of every theme's accent (gold, ember, candle gold, oxblood, blood red).
   Belongs in tokens.css as --fx; scoped here until it moves. */

/* ---------- Discord bots in the top strip ---------- */
.lv-dc.wait .lv-dc-dot { border-color: var(--warn); border-style: dashed; }
.lv-dc.err { border-color: var(--danger); }
.lv-dc.err .lv-dc-dot { background: var(--danger); border-color: var(--danger); }
.lv-warn { min-width: 0; flex: 0 1 auto; overflow: hidden; }
.lv-warn-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lv-fix { flex: none; }
@container app (max-width: 1180px) { .lv-warn-more { display: none; } }
.menu .lv-moveto { padding-top: 4px; }
.lv-warn { min-width: 92px; }
.lv-warn-short { display: none; }
@container app (max-width: 900px) { .lv-warn-long { display: none; } .lv-warn-short { display: inline; } }
.lv-warn { flex: none; }
/* Narrow strip: the session name keeps room; Fade all and Stop all become icon buttons (names kept for screen readers). */
.lv-sess { min-width: 140px; }
@container app (max-width: 900px) {
  .lv-top .lv-btxt { display: none; }
  .lv-top [data-act="lvfade"], .lv-top [data-act="lvstop"] { width: var(--ctl-s); padding: 0; }
}

/* ---------- Outputs inline in On air; one section per mix ---------- */
.lv-dc1 { display: inline-flex; }
.lv-outs { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.lv-out { display: grid; grid-template-columns: 8px minmax(60px, auto) minmax(0, 1fr) auto 84px 24px auto; align-items: center; gap: 6px; min-height: 30px; padding: 2px 8px; font-size: var(--fs-s); min-width: 0; }
.lv-out + .lv-out { border-top: 1px solid var(--line); }
.lv-out.none { display: block; font-size: var(--fs-xs); }
.lv-out .lv-dc-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
.lv-out.on .lv-dc-dot { background: var(--ok); border-color: var(--ok); }
.lv-out.wait .lv-dc-dot { border-color: var(--warn); border-style: dashed; }
.lv-out-n { min-width: 0; max-width: 140px; }
.lv-out-w { min-width: 0; font-size: var(--fs-xs); color: var(--ink-2); }
.lv-out.muted .lv-out-n { color: var(--ink-2); text-decoration: line-through; }
.lv-mute[aria-pressed="true"] { background: var(--surface-3); border-color: var(--ink-2); }
.lv input.lv-vol { width: 84px; min-width: 0; height: 24px; margin: 0; accent-color: var(--ink-2); }
.lv-out-v { font-size: var(--fs-xs); color: var(--ink-2); text-align: right; }
.lv-out-add { display: flex; align-items: center; gap: 8px; padding: 2px 8px 4px; border-top: 1px solid var(--line); }
.lv-ownmix { border-left: 3px solid var(--ink-3); }
.lv-mixfoot { flex-wrap: wrap; }
.lv-mixfoot .hint { min-width: 160px; }
.badge.lv-mixb { background: transparent; border: 1px solid var(--ink-2); color: var(--ink); }
.lv-target { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.lv-target .seg { min-width: 0; max-width: 100%; }
.lv-target .seg button { min-width: 0; }
.lv-target .hint { min-width: 0; flex: 1; }
@container app (max-width: 900px) { .lv-out { grid-template-columns: 8px minmax(50px, auto) minmax(0, 1fr) auto 64px auto; } .lv-out-v { display: none; } .lv input.lv-vol { width: 64px; } }

/* ---------- Round 4: the page scrolls; boxes take their own height ---------- */
.lv-cols { grid-template-rows: auto; overflow-y: auto; align-items: start; overscroll-behavior: contain; }
.lv-cols > .col { min-height: 0; }
.lv-cols > .col > .pane, .lv-cols > .col > .pane[data-size="auto"] { flex: none; }
.lv .pane-body { overflow: visible; }
.lv-cols.c1 > .col > .pane > .pane-body { overflow: visible; }

/* Send to: which rooms new sound goes to. */
.lv-send { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; min-width: 0; }
.lv-send-l { font-weight: 700; font-size: var(--fs-s); flex: none; }
.lv-send-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.lv-send-chip { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl); padding: 0 10px 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-s); font-weight: 700; cursor: pointer; }
.lv-send-chip:hover { background: var(--surface-3); color: var(--ink); }
.lv-send-chip[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
.lv-check { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid var(--ink-2); border-radius: 3px; flex: none; }
.lv-send-chip[aria-pressed="true"] .lv-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lv-check svg.i { width: 12px; height: 12px; stroke-width: 2.6; }
.lv-send-one { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); }
.lv-send-one .lv-dc-dot.on, .lv-send .lv-dc-dot.on { background: var(--ok); border-color: var(--ok); }
.lv-send-warn { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-s); font-weight: 700; color: var(--warn); }
.lv-send-pv { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 45%; font-size: var(--fs-xs); color: var(--ink-2); padding: 0 2px 0 8px; border-left: 3px solid var(--preview); }
.lv-send-pv .ellipsis { min-width: 0; }

/* Room boxes */
.lv-room .pane-actions { gap: 6px; }
.lv-recv { font-size: var(--fs-xs); font-weight: 700; color: var(--ink); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.lv-room input.lv-vol { width: 72px; }
.lv-room-hint { padding: 8px 10px; font-size: var(--fs-s); color: var(--ink-2); }
.lv-addroom { display: flex; justify-content: flex-start; }
.lv-lane-c .btn.icon { flex: none; }
.lv .lv-sc-top { display: flex; flex-direction: column; gap: 6px; }
.lv .lv-sc-top .lv-undo { margin: 0; border: 1px solid var(--line); border-radius: var(--r-m); }

.lv-recv.off { border-color: var(--line-strong); color: var(--ink-2); font-weight: 400; }
.lv-off-f .search { flex: 1 1 170px; }

/* ---------- Round 4b: target chips, one-line lanes, pads per room ---------- */
.lv-to { display: inline-flex; align-items: center; gap: 4px; height: var(--ctl-s); max-width: 150px; min-width: 0; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--surface); color: var(--ink); font-size: var(--fs-xs); cursor: pointer; flex: 0 1 auto; }

.lv-lane.empty { grid-template-areas: "l t t" "l s s"; }
.lv-lane.empty .lv-lane-t { text-align: left; }
.lv-lane-sub.ellipsis { display: block; font-size: var(--fs-xs); color: var(--ink-2); }
.lv-lane-sub .lv-upnext b { color: var(--ink); }
.lv-pad-rm { flex: none; min-width: 16px; padding: 0 3px; border-radius: 3px; background: var(--onair); color: var(--onair-ink); font-size: var(--fs-xs); font-weight: 700; line-height: 16px; text-align: center; }
.lv-room .pane-actions { gap: 4px; flex: 0 1 auto; min-width: 0; }
.lv-room input.lv-vol { width: 64px; min-width: 40px; flex: 0 1 64px; }
.lv-room > header { min-width: 0; }
.lv-room .pane-h { min-width: 0; flex: 0 1 auto; }
.lv-off-count { justify-content: flex-end; }

    if (e.ctrlKey || e.metaKey) return false;
    if (typing) {
      if (e.key === 'Escape' && t.dataset.k === 'lv-q') { if (t.value) { S.q = ''; L.render(); } else t.blur(); return true; }
      return false;
    }
    // Plain Esc only clears the Off script search (core closes menus first).
    if (e.key === 'Escape') { if (S.q || S.tags.length) { S.q = ''; S.tags = []; L.render(); L.say('Search cleared'); return true; } return false; }
    var onControl = a && a !== document.body && a.matches('button, a, [role="menuitem"]');
    if (e.key === ' ' || e.key === 'Enter') {
      // A hold pad reached with the keyboard: play while the key is down.
      if (a && a.matches('.lv-pad[data-mode="hold"]') && (e.key === 'Enter' || S.keyNav)) { if (!e.repeat) { S.keyHeld[e.key] = { b: a.dataset.bid, p: a.dataset.pid }; firePads(a.dataset.bid, a.dataset.pid, 'down'); } return true; }
      if (e.key === 'Enter' || !S.keys1) return false;
      if (onControl && S.keyNav) return false; // Space presses a button you tabbed to
      if (!e.repeat) nextScene(); return true;
    }
    if (!S.keys1) return false;
    if (e.key === '/') { focusSearch(); return true; }
    if (e.key.length === 1) {
      var hit = padFor(e.key.toLowerCase()); if (!hit) return false;
      if (!e.repeat) { S.keyHeld[e.key.toLowerCase()] = { b: hit.b, p: hit.p.id }; firePads(hit.b, hit.p.id, 'down'); }
      return true;
    }
    return false;
  });
  document.addEventListener('keyup', function (e) {
    var k = e.key.length === 1 && e.key !== ' ' ? e.key.toLowerCase() : e.key, h = S.keyHeld[k];
    if (!h) return; delete S.keyHeld[k];
    var b = L.board(h.b), p = b && b.slots.filter(function (x) { return x && x.id === h.p; })[0];
    if (p && p.mode === 'hold') { e.preventDefault(); L.firePad(h.b, h.p, 'up'); }
  });
  document.addEventListener('pointerdown', function (e) {
    var p = e.target.closest && e.target.closest('.lv-pad[data-mode="hold"]'); if (!p || e.button > 0) return;
    e.preventDefault(); S.holding = { b: p.dataset.bid, p: p.dataset.pid }; firePads(S.holding.b, S.holding.p, 'down');
    var again = document.querySelector('[data-k="lv-pad-' + S.holding.b + '-' + S.holding.p + '"]'); if (again) again.focus({ preventScroll: true });
  });
  function release() { if (S.holding) { var h = S.holding; S.holding = null; L.firePad(h.b, h.p, 'up'); } }
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);
  window.addEventListener('blur', function () {
    release();
    Object.keys(S.keyHeld).forEach(function (k) { var h = S.keyHeld[k], b = L.board(h.b), p = b && b.slots.filter(function (x) { return x && x.id === h.p; })[0]; delete S.keyHeld[k]; if (p && p.mode === 'hold') L.firePad(h.b, h.p, 'up'); });
  });
})();

</script>
<script>L.boot();</script>
