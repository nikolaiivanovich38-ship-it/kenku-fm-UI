<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyre Design Prototype</title>
<!--@fonts-->
<!--@css-->
</head>
<body>
<div id="frame">
  <div class="proto" id="proto" role="region" aria-label="Prototype controls (not part of Lyre)"></div>
  <div class="notes" id="notes" role="region" aria-label="Design notes (not part of Lyre)"></div>
  <div id="stagewrap">
    <div id="app">
      <aside id="rail" class="rail"></aside>
      <main id="view" class="view"></main>
    </div>
  </div>
</div>
<div id="lyre-live" class="sr-only" aria-live="polite"></div>
<!-- Round 6, part 5: the one place for the Saved pop-up and every other note (core.js L.saved, L.toast, L.saveFailed). -->
<div id="lyre-toasts" class="toasts"><div id="lyre-fail" class="toast" role="alert"></div><div id="lyre-toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div></div>
<!--@js-->
<script>L.boot();</script>
</body>
</html>
