# FND-5: static security analysis of the JavaScript/TypeScript code.
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Run the analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:javascript-typescript"
      - name: Say what failed, in plain words
        if: failure()
        shell: bash
        run: |
          echo "::error title=The code security analysis did not finish::Open the step above for the reason; findings themselves are listed under Security > Code scanning."
          echo "- **CodeQL**: the analysis did not finish." >> "$GITHUB_STEP_SUMMARY"
