# FND-5: quality gate. Runs on every push and pull request, and is called by
# release.yml so a release can only be built from code that passes it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Type check, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: "yarn"
      # zlib-sync is built from source here; GitHub runners download the
      # Node headers it needs automatically.
      - name: Install dependencies (exactly as locked)
        run: yarn install --frozen-lockfile --non-interactive
      - name: Type check
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Unit and component tests with coverage
        run: yarn test:coverage
      - name: Tests for build scripts
        run: yarn test:scripts
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    # FND-4: start the packaged app and check it opens without errors.
    name: End-to-end tests (packaged app, Windows)
    # Pinned to Windows Server 2022 (Visual Studio 2022): windows-latest now
    # ships Visual Studio 2026, which the node-gyp versions used by yarn (11.x)
    # and by Electron Forge's rebuild (@electron/node-gyp 10.2) cannot find,
    # so building zlib-sync fails. Move back to windows-latest once both
    # support VS 2026 (backlog FND-7).
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: "yarn"
      - name: Install dependencies (exactly as locked)
        run: yarn install --frozen-lockfile --non-interactive
      # CUE_DESK_E2E_BUILD keeps the --inspect fuse on so Playwright can drive
      # the app. Native modules are rebuilt for Electron as in a release.
      - name: Package the app for testing
        run: yarn package --arch=x64
        env:
          CUE_DESK_E2E_BUILD: "1"
      - name: Run end-to-end tests
        run: yarn e2e
      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    name: Dependency audit (shipped libraries and Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      # Fails on high/critical advisories not listed in scripts/audit-allowlist.json.
      - name: Check for new high or critical advisories
        run: node scripts/audit-check.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Free for personal GitHub accounts; an organisation would need GITLEAKS_LICENSE.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
