# FND-5: build the Windows installer and attach it to a DRAFT GitHub release.
#
# Start it by pushing a version tag (for example v0.1.0, matching
# package.json), or by pushing the commit to release to the `release` branch
# (for tools that may push branches but not tags). The quality gate in ci.yml
# runs first; the build only starts if it passes. "Run workflow" from the
# Actions tab on another branch builds the files as a downloadable workflow
# artifact but publishes nothing. A tag or `release` run creates the draft
# release for the version in package.json, tied to the exact commit that was
# built (target_commitish): from a `release` push, GitHub creates the tag on
# that commit when the draft is published.
#
# Two jobs: "build" has read-only access to the repository; "publish" holds
# the only write permission and does nothing but attach the built files.
#
# Builds are UNSIGNED: no Windows code-signing certificate. Windows SmartScreen will warn on first install.
# Upstream's signed flow is kept in publish/ for later; see docs/DEVELOPING.md.
#
# The draft stays invisible to users and to automatic updates until the
# product owner publishes it after docs/RELEASE_CHECKLIST.md is complete.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows x64 installer
    needs: gate
    # FND-10: the app has no modules compiled from C++ (zlib-sync was
    # dropped), so no Visual Studio is needed and the current image works.
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache here: a release is built from a clean install.
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      - name: Read the version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::The tag $TAG does not match the version in package.json ($EXPECTED). Change one of them so they match, then tag again."
            exit 1
          fi
      - name: Install dependencies (exactly as locked)
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build installer and zip
        run: yarn make --arch=x64
      - name: Check the app's security fuses (SEC-13)
        # Fails if this is a test build (--inspect on) or any fuse is loosened.
        run: node scripts/check-release-fuses.mjs "out/Cue Desk-win32-x64/cue-desk.exe"
      - name: Collect release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item out/make/squirrel.windows/x64/* release/
          Copy-Item out/make/zip/win32/x64/*.zip release/
          Get-ChildItem release -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-ChildItem release
      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to a draft release
    needs: build
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: release
      # Assets needed by update.electronjs.org: RELEASES, the .nupkg it names
      # and a file whose name contains "-win32-x64" (the setup .exe).
      - name: Attach to a draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
          body: |
            Windows installer: download the file ending in `-win32-x64-setup.exe` and run it.
            The build is not code-signed yet, so Windows may show "Windows protected your PC";
            choose "More info", then "Run anyway".
            What changed: see CHANGELOG.md. File checksums: SHA256SUMS.txt.
