# FND-15: every acceptance spec and every end-to-end test of the packaged app, on Linux, split across machines.
#
# Runs when a branch whose name starts with ci/ is pushed (git push <remote> HEAD:ci/<name>), or by hand ("Run
# workflow" in the Actions tab). On one 2-core machine the app's specs take about 95 minutes; here they take about
# 15 to 20 minutes from push to summary:
#   - "Package" builds the test package once (CUE_DESK_E2E_BUILD=1 yarn package, about 4 minutes) and keeps it as an
#     artifact (a tar, so the programs stay executable);
#   - eight "App specs" jobs each run an eighth of the app project (playwright.spec.config.ts, one copy of the app at
#     a time, as on the build machine), "Prototype specs" runs the prototype project and "End-to-end tests" runs
#     yarn e2e, all against that one package and side by side (about 12 minutes);
#   - "Summary" merges their reports into one artifact, test-report (specs/index.html and e2e/index.html), and writes
#     on the run's summary page, in plain words, how many tests passed and failed, and which.
# Failures also leave their screenshots and traces in a failures-<job> artifact; the summary links each failed test
# straight to the artifact of the job it ran in and names its screenshot there.
# node_modules and Playwright's Chromium are cached between runs (keyed on yarn.lock and the Playwright version).
#
# Chromium's sandbox stays on. Ubuntu 24.04 and later (ubuntu-latest) stop programs from making the user namespaces the sandbox needs
# (AppArmor), so each job that starts the app allows them first (sysctl). Nothing here switches the sandbox off.
#
# The repository is public, so GitHub's standard runners cost nothing.
name: Specs

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package the test build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node_modules as yarn.lock makes them, kept between runs: on a hit yarn install only checks them (a second, not
      # 15), and Electron and ffmpeg are not downloaded again. Saved right after the install, before anything (the
      # package's native rebuild) changes them. On a miss, yarn's own download cache helps instead.
      - name: Bring back node_modules
        id: modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('yarn.lock', 'package.json') }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
      - name: Install dependencies (exactly as locked)
        id: install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Keep node_modules for the next run
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # CUE_DESK_E2E_BUILD keeps the --inspect fuse on so Playwright can drive the app.
      - name: Package the app for testing
        id: package
        run: yarn package
        env:
          CUE_DESK_E2E_BUILD: "1"
      - name: Pack it in a tar (artifacts lose the executable bit)
        run: tar -cf lyre-linux-x64.tar -C out Lyre-linux-x64
      - name: Keep the test build for the test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lyre-linux-x64-test-build
          path: lyre-linux-x64.tar
          if-no-files-found: error
          retention-days: 3
      - name: Say what failed, in plain words
        if: failure()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          say() { echo "::error title=$1::$2"; echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$INSTALL" = failure ]; then say "Install failed" "The libraries could not be installed on Linux exactly as yarn.lock lists them."; fi
          if [ "$PACKAGE" = failure ]; then say "Packaging failed" "The test build could not be made on Linux, so no test ran. Run CUE_DESK_E2E_BUILD=1 yarn package to see why."; fi

  app:
    name: App specs, part ${{ matrix.shard }} of 8
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node_modules as yarn.lock makes them, kept between runs: on a hit yarn install only checks them (a second, not
      # 15), and Electron and ffmpeg are not downloaded again. Saved right after the install, before anything (the
      # package's native rebuild) changes them. On a miss, yarn's own download cache helps instead.
      - name: Bring back node_modules
        id: modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('yarn.lock', 'package.json') }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
      - name: Install dependencies (exactly as locked)
        id: install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Keep node_modules for the next run
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # The app project still opens Playwright's own headless browser beside the app (docs/testing.md > Specs).
      # The runner image already has every library Chromium and Electron need, and Xvfb. --with-deps would only add
      # fonts, through apt mirrors that were unreachable for 10 minutes on the first run (11 Nov), so it is left out.
      # Playwright's Chromium for this Playwright version, kept between runs (about 170 MB from Playwright's servers).
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Bring back Playwright's Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's Chromium
        id: browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Let Chromium's sandbox start (Ubuntu 24.04 and later restrict user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download the test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lyre-linux-x64-test-build
      - name: Unpack the test build
        run: mkdir -p out && tar -xf lyre-linux-x64.tar -C out
      # The blob report is merged by the Summary; the JSON report keeps where each failure's screenshot is.
      - name: Run part ${{ matrix.shard }} of 8 of the app's specs
        id: specs
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: reports/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: app-${{ matrix.shard }}.zip
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/app-${{ matrix.shard }}.json
        run: xvfb-run -a npx playwright test -c playwright.spec.config.ts --project=app --shard=${{ matrix.shard }}/8 --reporter=list,blob,json
      - name: Keep screenshots and traces of the failures
        id: failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-app-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Note the failures' address, so the summary links each failure to it
        if: failure() && steps.failures.outputs.artifact-url != ''
        env:
          URL: ${{ steps.failures.outputs.artifact-url }}
        run: printf '%s\n' "$URL" > reports/app-${{ matrix.shard }}.failures-url
      - name: Keep the reports for the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-specs-app-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn
          retention-days: 3
      - name: Say what failed, in plain words
        if: failure()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          SPECS: ${{ steps.specs.outcome }}
          PART: ${{ matrix.shard }}
        run: |
          say() { echo "::error title=$1::$2"; echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$INSTALL" = failure ]; then say "Install failed" "The libraries could not be installed on Linux exactly as yarn.lock lists them."; fi
          if [ "$BROWSER" = failure ]; then say "Browser set-up failed" "Playwright's Chromium could not be downloaded. Run the workflow again; if it fails again, read this step's log."; fi
          if [ "$SPECS" = failure ]; then say "An app spec failed (part $PART of 8)" "Something approved in the design no longer works in the app. The Summary job names the test; the failures-app-$PART artifact has its screen and trace."; fi

  prototype:
    name: Prototype specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node_modules as yarn.lock makes them, kept between runs: on a hit yarn install only checks them (a second, not
      # 15), and Electron and ffmpeg are not downloaded again. Saved right after the install, before anything (the
      # package's native rebuild) changes them. On a miss, yarn's own download cache helps instead.
      - name: Bring back node_modules
        id: modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('yarn.lock', 'package.json') }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
      - name: Install dependencies (exactly as locked)
        id: install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Keep node_modules for the next run
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # The runner image already has every library Chromium and Electron need, and Xvfb. --with-deps would only add
      # fonts, through apt mirrors that were unreachable for 10 minutes on the first run (11 Nov), so it is left out.
      # Playwright's Chromium for this Playwright version, kept between runs (about 170 MB from Playwright's servers).
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Bring back Playwright's Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's Chromium
        id: browser
        timeout-minutes: 5
        run: npx playwright install chromium
      # No build: the prototype is a page opened as a file. Two at a time (the config's workers on CI).
      - name: Run the prototype's specs
        id: specs
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: reports/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: prototype.zip
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/prototype.json
        run: npx playwright test -c playwright.spec.config.ts --project=prototype --reporter=list,blob,json
      - name: Keep screenshots and traces of the failures
        id: failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-prototype
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Note the failures' address, so the summary links each failure to it
        if: failure() && steps.failures.outputs.artifact-url != ''
        env:
          URL: ${{ steps.failures.outputs.artifact-url }}
        run: printf '%s\n' "$URL" > reports/prototype.failures-url
      - name: Keep the reports for the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-specs-prototype
          path: reports/
          if-no-files-found: warn
          retention-days: 3
      - name: Say what failed, in plain words
        if: failure()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          SPECS: ${{ steps.specs.outcome }}
        run: |
          say() { echo "::error title=$1::$2"; echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$INSTALL" = failure ]; then say "Install failed" "The libraries could not be installed on Linux exactly as yarn.lock lists them."; fi
          if [ "$BROWSER" = failure ]; then say "Browser set-up failed" "Playwright's Chromium could not be downloaded. Run the workflow again; if it fails again, read this step's log."; fi
          if [ "$SPECS" = failure ]; then say "A prototype spec failed" "The specs and the approved prototype disagree: the prototype or the spec changed. The Summary job names the test; the failures-prototype artifact has its screen and trace."; fi

  e2e:
    name: End-to-end tests
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node_modules as yarn.lock makes them, kept between runs: on a hit yarn install only checks them (a second, not
      # 15), and Electron and ffmpeg are not downloaded again. Saved right after the install, before anything (the
      # package's native rebuild) changes them. On a miss, yarn's own download cache helps instead.
      - name: Bring back node_modules
        id: modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('yarn.lock', 'package.json') }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
      - name: Install dependencies (exactly as locked)
        id: install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Keep node_modules for the next run
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # The runner image already has every library Chromium and Electron need, and Xvfb. --with-deps would only add
      # fonts, through apt mirrors that were unreachable for 10 minutes on the first run (11 Nov), so it is left out.
      # Playwright's Chromium for this Playwright version, kept between runs (about 170 MB from Playwright's servers).
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Bring back Playwright's Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's Chromium
        id: browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Let Chromium's sandbox start (Ubuntu 24.04 and later restrict user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download the test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lyre-linux-x64-test-build
      - name: Unpack the test build
        run: mkdir -p out && tar -xf lyre-linux-x64.tar -C out
      - name: Run every end-to-end test
        id: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: reports/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: e2e.zip
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/e2e.json
        run: xvfb-run -a yarn e2e --reporter=list,blob,json
      - name: Keep screenshots, traces and the app's log of the failures
        id: failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Note the failures' address, so the summary links each failure to it
        if: failure() && steps.failures.outputs.artifact-url != ''
        env:
          URL: ${{ steps.failures.outputs.artifact-url }}
        run: printf '%s\n' "$URL" > reports/e2e.failures-url
      - name: Keep the reports for the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-e2e
          path: reports/
          if-no-files-found: warn
          retention-days: 3
      - name: Say what failed, in plain words
        if: failure()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          say() { echo "::error title=$1::$2"; echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$INSTALL" = failure ]; then say "Install failed" "The libraries could not be installed on Linux exactly as yarn.lock lists them."; fi
          if [ "$BROWSER" = failure ]; then say "Browser set-up failed" "Playwright's Chromium could not be downloaded. Run the workflow again; if it fails again, read this step's log."; fi
          if [ "$E2E" = failure ]; then say "An end-to-end test failed" "Something a game master does in the app no longer works. The Summary job names the test; the failures-e2e artifact has its screen, trace and the app's log."; fi

  summary:
    name: Summary
    needs: [package, app, prototype, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node_modules as yarn.lock makes them, kept between runs: on a hit yarn install only checks them (a second, not
      # 15), and Electron and ffmpeg are not downloaded again. Saved right after the install, before anything (the
      # package's native rebuild) changes them. On a miss, yarn's own download cache helps instead.
      - name: Bring back node_modules
        id: modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('yarn.lock', 'package.json') }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
      - name: Install dependencies (exactly as locked)
        id: install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Keep node_modules for the next run
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # Each job's reports: blob/<job>.zip (merged here), <job>.json (its own results, with where each failure's
      # screenshot is) and, after a failure, <job>.failures-url (the address of its failures artifact).
      - name: Download the specs' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-specs-*
          path: reports/specs
          merge-multiple: true
      - name: Download the end-to-end tests' report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blob-e2e
          path: reports/e2e
        continue-on-error: true
      # The specs (app and prototype) share one config, so they merge into one report; the end-to-end tests have
      # their own config and files of the same names, so they get a report of their own beside it.
      - name: Merge the reports
        id: merge
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          mkdir -p test-report results
          merge() { # <blob folder> <html folder> <json file>
            [ -n "$(ls "$1"/*.zip 2>/dev/null)" ] || { echo "No reports in $1"; return 0; }
            PLAYWRIGHT_HTML_OUTPUT_DIR="$2" PLAYWRIGHT_JSON_OUTPUT_FILE="$3" npx playwright merge-reports --reporter=html,json "$1"
          }
          merge reports/specs/blob test-report/specs results/specs.json
          merge reports/e2e/blob test-report/e2e results/e2e.json
      - name: Keep the merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: test-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Say how many passed and failed, and which, in plain words
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=(--run "Acceptance specs (app and prototype)=results/specs.json" --run "End-to-end tests=results/e2e.json")
          part() { args+=(--part "$1=$2.json" --artifact "$1=$2.failures-url"); } # <label> <reports/…/job>
          for n in 1 2 3 4 5 6 7 8; do part "App specs, part $n of 8" "reports/specs/app-$n"; done
          part "Prototype specs" reports/specs/prototype
          part "End-to-end tests" reports/e2e/e2e
          node scripts/test-summary.mjs "${args[@]}"
      - name: Say what failed, in plain words
        if: failure()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          MERGE: ${{ steps.merge.outcome }}
        run: |
          say() { echo "::error title=$1::$2"; echo "- **$1**: $2" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$INSTALL" = failure ]; then say "Install failed" "The libraries could not be installed on Linux exactly as yarn.lock lists them."; fi
          if [ "$MERGE" = failure ]; then say "The reports could not be merged" "The test jobs' own logs still show each result. Read this step's log for why."; fi
